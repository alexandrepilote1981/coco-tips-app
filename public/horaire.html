<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Horaire — Déclara</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Déclara" />
<meta name="theme-color" content="#10151D" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background-color: #10151D;
    color: #F1EFEA; padding-bottom: 60px; -webkit-font-smoothing: antialiased; }
  .header {
    background: linear-gradient(160deg,#161C26 0%,#10151D 100%); padding: 30px 22px 32px; color: white;
    display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -140px; right: -60px; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,168,87,0.16), transparent 70%); pointer-events: none;
  }
  .title { font-family: 'Fraunces', serif; font-size: 25px; font-weight: 600; margin: 0; display:flex; align-items:center; letter-spacing: -0.01em; position: relative; }
  .title-mark {
    width: 34px; height: 34px; border-radius: 9px; background: #6FBF93; color: #10151D;
    display: inline-flex; align-items: center; justify-content: center; margin-right: 10px; flex-shrink: 0;
    font-style: italic; font-size: 18px; box-shadow: 0 4px 12px -3px rgba(111,191,147,0.5);
  }
  .lang-toggle { background: rgba(255,255,255,0.08); color: white; font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; position: relative; }
  .content { padding: 20px 16px; max-width: 900px; margin: 0 auto; }
  .card { background: #161C26; border-radius: 18px; padding: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 18px; }
  .login-screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #161C26 0%, #10151D 100%); padding: 24px; position: relative; overflow: hidden;
  }
  .login-screen::before {
    content: ''; position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
    width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,168,87,0.16), transparent 68%);
    pointer-events: none;
  }
  .login-screen::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .login-glow {
    position: absolute; border-radius: 50%; filter: blur(50px); pointer-events: none;
  }
  .login-glow.g1 { width: 260px; height: 260px; background: rgba(111,191,147,0.28); top: 6%; left: -10%; }
  .login-glow.g2 { width: 260px; height: 260px; background: rgba(212,168,87,0.25); bottom: 6%; right: -10%; }
  .login-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; animation: loginFadeUp .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes loginFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .login-brand-mark {
    width: 38px; height: 38px; border-radius: 10px; background: #6FBF93;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 6px 16px -4px rgba(111,191,147,0.5);
    font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; font-size: 21px; color: #10151D;
  }
  .login-brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 27px; color: white; letter-spacing: -0.01em; }
  .login-box {
    max-width: 360px; width: 100%; text-align: center; background: #161C26; border-radius: 18px;
    padding: 38px 30px 32px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
  }
  .login-box::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 7px;
    background: linear-gradient(90deg, #6FBF93 0%, #D4A857 55%, #E2685A 100%);
  }
  .login-tagline {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
    font-size: 16px; color: #A8C4B4; margin: 0 0 30px; text-align: center; max-width: 300px;
  }
  .login-box h2 {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #D4A857;
    margin: 0 0 22px; text-transform: uppercase; letter-spacing: 0.08em;
    background: rgba(212,168,87,0.12); padding: 6px 14px; border-radius: 999px;
  }
  .login-field-wrap { position: relative; margin-bottom: 14px; }
  .login-field-wrap svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: #D4A857; pointer-events: none;
  }
  .login-box input[type=password] {
    width: 100%; padding: 13px 14px 13px 38px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.1);
    font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; background: #10151D; color: #F1EFEA;
  }
  .login-box input[type=password]:focus { border-color: #D4A857; box-shadow: 0 0 0 3px rgba(212,168,87,0.15); }
  .login-box button#loginBtn {
    width: 100%; background: #D4A857; color: #10151D; border: none; border-radius: 10px;
    padding: 13px; font-size: 14.5px; font-weight: 700; cursor: pointer; transition: background .15s, transform .15s, box-shadow .15s;
  }
  .login-box button#loginBtn:hover { background: #E5C078; transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(212,168,87,0.5); }
  .login-back {
    margin-top: 24px; font-size: 12.5px; color: rgba(255,255,255,0.5); text-decoration: none; transition: color .15s;
  }
  .login-back:hover { color: #A8C4B4; }
  .login-lang-toggle {
    position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.12); color: white;
    font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: none; cursor: pointer; z-index: 2;
  }
  input, button, select { font-family: inherit; }
  input[type=password], input[type=text] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: #10151D; color: #F1EFEA; font-size: 14px; margin-bottom: 10px; }
  button { background: #6FBF93; color: #10151D; border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button.secondary { background: rgba(255,255,255,0.08); color: #F1EFEA; }
  button.danger { background: #E2685A; color: #10151D; }
  .restaurant-title {
    font-family: 'Fraunces', serif; font-size: 23px; font-weight: 600; color: #F1EFEA; margin: 0 0 4px;
    display:flex; justify-content:space-between; align-items:center; letter-spacing: -0.01em;
  }
  .restaurant-total { font-size: 12.5px; color: #8993A4; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .employee-card-block {
    background: #1B222D; border-radius: 14px; padding: 16px 16px 14px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.06);
  }
  .employee-card-block:last-of-type { margin-bottom: 0; }
  .employee-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 0 0 10px; }
  .employee-card-block:first-of-type .employee-row { border-top: none; }
  .employee-row-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .secondary-btn { background: rgba(255,255,255,0.08); color: #F1EFEA; font-size: 10px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; height: fit-content; }
  .employee-stats { display: flex; gap: 22px; flex-wrap: wrap; padding: 4px 0 12px; align-items: flex-end; }
  .employee-stat-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #8993A4; font-weight: 700; margin-bottom: 3px; }
  .employee-stat-value { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: #F1EFEA; }
  .employee-name { font-weight: 700; font-size: 15px; color: #F1EFEA; }
  .employee-sub { font-size: 11px; color: #8993A4; }
  .link-box { font-size: 11px; background: rgba(255,255,255,0.06); color: #8993A4; padding: 4px 8px; border-radius: 6px; font-family: monospace; word-break: break-all; }
  .link-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .link-row .link-box { flex: 1; margin-top: 0; }
  .copy-btn { background: #6FBF93; color: #10151D; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
  .copy-btn.copied { background: #D4A857; }
  .report-toggle {
    background: rgba(255,255,255,0.08); color: #F1EFEA; font-size: 11px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; margin-top: 8px;
  }
  .report-table-wrap { margin-top: 10px; overflow-x: auto; }
  .report-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .report-table th {
    text-align: left; font-size: 9px; text-transform: uppercase; color: #8993A4;
    padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap;
  }
  .report-table td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; color: #D8D5CE; }
  .report-table tr:last-child td { border-bottom: none; }
  .report-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); vertical-align: middle; }
  .delay-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
  .delay-badge.delay-ok { background: rgba(111,191,147,0.15); color: #6FBF93; }
  .delay-badge.delay-warn { background: rgba(212,168,87,0.15); color: #D4A857; }
  .delay-badge.delay-bad { background: rgba(226,104,90,0.15); color: #E2685A; }
  .modified-badge { font-size: 9px; color: #D4A857; margin-top: 2px; white-space: nowrap; }
  tr.row-jump-highlight { animation: rowJumpFlash 1.6s ease; }
  @keyframes rowJumpFlash { 0% { background: rgba(212,168,87,0.18); } 100% { background: transparent; } }
  .row-flagged-owed-employee { background: rgba(226,104,90,0.08); }
  .row-flagged-owed-employer { background: rgba(212,168,87,0.08); }
  .transfer-btn { background: #E2685A; color: #10151D; font-size: 10px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; font-weight: 700; }
  .transfer-btn.owed-employer { background: #D4A857; }
  .transfer-done {
    display: inline-block; background: #39E639; color: #10151D; font-weight: 700; font-size: 11px;
    white-space: nowrap; padding: 4px 10px; border-radius: 999px;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box { background: #161C26; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; max-width: 340px; width: 100%; color: #F1EFEA; }
  .modal-box h3 { margin: 0 0 10px; font-size: 16px; color: #F1EFEA; }
  .modal-header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-header-row h3 { margin: 0; }
  .modal-close-x { background: none; border: none; font-size: 18px; color: #8993A4; padding: 0 0 0 10px; line-height: 1; cursor: pointer; }
  .modal-box p { font-size: 13px; color: #8993A4; margin: 0 0 14px; }
  .modal-box input[type=date] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: #10151D; color: #F1EFEA; font-size: 14px; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; }
  .modal-actions button.danger-text { background: rgba(226,104,90,0.15); color: #E2685A; }
  .pending-banner {
    background: rgba(226,104,90,0.1); border: 1px solid rgba(226,104,90,0.25); color: #E2685A; border-radius: 14px;
    padding: 12px 14px; font-size: 13px; font-weight: 700; margin-bottom: 14px;
  }
  .pending-banner.banner-delay {
    background: rgba(212,168,87,0.1); border: 1px solid rgba(212,168,87,0.25); color: #D4A857;
  }
  .messages-toggle {
    background: none; border: none; padding: 0; color: #F1EFEA; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  }
  .messages-toggle .icn-circle {
    width: 38px; height: 38px; border-radius: 10px; background: rgba(111,191,147,0.15);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #6FBF93;
  }
  .unread-badge {
    background: #E2685A; color: #10151D; font-size: 11px; font-weight: 800; border-radius: 999px;
    padding: 2px 8px; min-width: 18px; text-align: center; display: inline-block;
  }
  .thread-row {
    display: block; width: 100%; text-align: left; background: none; border: none;
    border-top: 1px solid rgba(255,255,255,0.07); padding: 10px 0;
  }
  .thread-row:first-child { border-top: none; }
  .thread-row-top { display: flex; justify-content: space-between; align-items: center; }
  .thread-name { font-size: 13px; font-weight: 700; color: #F1EFEA; }
  .thread-resto { font-size: 11px; font-weight: 400; color: #8993A4; }
  .thread-preview { font-size: 12px; color: #8993A4; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-date { font-size: 10px; color: #6B7280; margin-top: 2px; }
  .thread-modal-box { max-width: 400px; }
  .conversation-history { max-height: 280px; overflow-y: auto; margin-bottom: 12px; padding-right: 2px; }
  .conv-bubble { max-width: 88%; margin-bottom: 8px; padding: 8px 10px; border-radius: 12px; position: relative; }
  .conv-bubble.conv-employee { background: rgba(255,255,255,0.06); margin-right: auto; border-bottom-left-radius: 4px; }
  .conv-bubble.conv-admin { background: rgba(212,168,87,0.15); margin-left: auto; border-bottom-right-radius: 4px; }
  .conv-sender { font-size: 9px; font-weight: 700; text-transform: uppercase; color: #8993A4; margin-bottom: 2px; }
  .conv-body { font-size: 13px; color: #F1EFEA; white-space: pre-wrap; }
  .conv-delete-btn {
    background: none; border: none; color: #6B7280; font-size: 10px; padding: 4px 0 0;
    text-decoration: underline; cursor: pointer;
  }
  .reply-textarea {
    width: 100%; min-height: 60px; border: none; border-radius: 8px; padding: 8px;
    font-size: 13px; font-family: inherit; background: rgba(255,255,255,0.06); color: #F1EFEA; outline: none; resize: vertical; margin-bottom: 6px;
  }
  .pending-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pending-chip {
    background: rgba(255,255,255,0.06); font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; color: #F1EFEA;
  }
  .pending-chip.chip-owed-employee { color: #E2685A; }
  .pending-chip.chip-owed-employer { color: #D4A857; }
  .pending-chip-wrap { display: inline-flex; align-items: stretch; border-radius: 999px; overflow: hidden; }
  .pending-chip-wrap .pending-chip { border-radius: 999px 0 0 999px; border-right: none; }
  .chip-dismiss-x {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-left: 1px solid rgba(255,255,255,0.1);
    color: #8993A4; font-size: 11px; padding: 6px 9px; border-radius: 0 999px 999px 0;
  }
  .employee-card-block.jump-highlight { animation: jumpFlash 1.6s ease; }
  @keyframes jumpFlash { 0% { background: rgba(212,168,87,0.18); } 100% { background: #1B222D; } }
  .totals { font-size: 12px; text-align: right; color: #8993A4; }
  .totals b { color: #F1EFEA; }
  .add-form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add-form input { flex: 1; min-width: 120px; margin-bottom: 0; }
  .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #8993A4; margin: 20px 0 8px; }
  .period-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .period-btn { background: rgba(255,255,255,0.07); color: #F1EFEA; font-size: 12px; padding: 7px 12px; border-radius: 999px; }
  .period-btn.active { background: #6FBF93; color: #10151D; }
  .period-dates { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #8993A4; }
  .period-dates input {
    padding: 8px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.1); background: #10151D; font-size: 12px;
    margin-bottom: 0; color: #F1EFEA;
  }
  .period-label { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; color: #F1EFEA; margin-top: 6px; margin-bottom: 6px; letter-spacing: -0.01em; }
  .export-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px; background: #D4A857; color: #10151D;
    font-size: 13.5px; font-weight: 700; padding: 13px; border-radius: 10px; box-shadow: 0 2px 8px rgba(212,168,87,0.25);
  }
  .sparkline-wrap { margin-top: 4px; }
  .sparkline-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #8993A4; font-weight: 700; margin-bottom: 6px; }
  .sparkline-bar { fill: #6FBF93; }
  .sparkline-bar.negative { fill: #E2685A; }

  /* ---------- Horaire : grille hebdomadaire ---------- */
  .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .week-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; color: #F1EFEA; }
  .week-nav { display: flex; gap: 6px; }
  .week-nav button {
    background: rgba(255,255,255,0.08); border: none; color: #F1EFEA; padding: 6px 10px;
    border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .week-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .duplicate-week-btn {
    background: rgba(212,168,87,0.14); border: 1px solid rgba(212,168,87,0.3); color: #D4A857;
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .pdf-week-btn {
    background: rgba(111,191,147,0.14); border: 1px solid rgba(111,191,147,0.32); color: #6FBF93;
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .photo-week-btn {
    background: rgba(111,191,147,0.14); border: 1px solid rgba(111,191,147,0.32); color: #6FBF93;
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  /* Rouge et en dernier : on ne l'atteint pas par accident en visant un export. */
  .clear-week-btn {
    background: rgba(226,104,90,0.12); border: 1px solid rgba(226,104,90,0.3); color: #E2685A;
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .pdf-week-btn:disabled, .duplicate-week-btn:disabled, .clear-week-btn:disabled, .photo-week-btn:disabled { opacity: 0.55; }
  /* Masse salariale de la semaine affichée. Collée en haut : le chiffre sert pendant qu'on
     bouge un quart, pas après — et sur un téléphone, il sortirait sinon de l'écran dès qu'on
     descend dans la grille. */
  .cout-bar {
    position: sticky; top: 8px; z-index: 40;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
    background: #10151D; border: 1px solid rgba(111,191,147,0.22); border-radius: 14px;
    padding: 10px 14px; margin-bottom: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .cout-bloc { flex: 1 1 88px; min-width: 88px; }
  .cout-etiq { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #8993A4; font-weight: 700; }
  .cout-val { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; color: #F1EFEA; margin-top: 2px; }
  .cout-val.cout-gros { font-size: 20px; color: #D4A857; }
  .cout-val.cout-baisse { color: #6FBF93; }
  .cout-val.cout-hausse { color: #E2685A; }
  .cout-val.cout-egal { color: #8993A4; }

<script>
// Safari en navigation privée — et tout navigateur réglé pour bloquer les données de site —
// peut lever une exception sur le simple ACCÈS à localStorage, pas seulement sur l'écriture.
// Sans ces gardes, la ligne qui lit le jeton au chargement tuait le script en entier : écran
// blanc, rien ne répond. Ici, la préférence est simplement perdue le temps de la visite.
function lireStockage(zone, cle) {
  try {
    return window[zone].getItem(cle);
  } catch (e) {
    return null;
  }
}
function ecrireStockage(zone, cle, valeur) {
  try {
    window[zone].setItem(cle, valeur);
  } catch (e) {
    /* réglage de confidentialité ou stockage plein : la valeur ne survivra pas à la visite */
  }
}

let lang = lireStockage("localStorage", "coco-lang") || "fr";
let TOKEN = lireStockage("sessionStorage", "scheduleToken") || "";
let roster = null;
let shifts = [];
// Ce que la porte ouverte par ce lien permet de voir et de faire. Par mot de passe (sans
// code dans l'URL) on est sur l'horaire de la salle, comme avant.
let porte = { secteur: "salle", peutModifier: true, voitMontants: false, chargesPct: 0 };

// Si l'URL est /horaire/CODE, on est en mode lien direct pour un seul restaurant —
// aucun mot de passe requis, comme les liens employés.
const pathParts = window.location.pathname.split("/").filter(Boolean);
const RESTAURANT_CODE = pathParts.length >= 2 && pathParts[0] === "horaire" ? pathParts[1] : null;

const I18N = {

      `${semaine}\n\nDelete the ${n} shift${n > 1 ? "s" : ""} of this week?\nThis is permanent: there is no way to get them back.`,

};
function t(key, ...args) {
  const v = I18N[lang][key];
  return typeof v === "function" ? v(...args) : (v ?? key);
}
function setLang(newLang) {
  lang = newLang;
  ecrireStockage("localStorage", "coco-lang", lang);
  if (TOKEN) render(); else renderLogin();
}

const ICON_PATHS = {
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash2: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
};
function icon(name, size = 16, extraStyle = "") {
  const path = ICON_PATHS[name];
  if (!path) return "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;${extraStyle}">${path}</svg>`;
}

async function login(password) {
  const r = await fetch("/api/schedule/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Erreur");
  TOKEN = data.token;
  ecrireStockage("sessionStorage", "scheduleToken", TOKEN);
}

async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Admin-Token": TOKEN, ...(opts && opts.headers) },
  });
  if (!res.ok) throw new Error((await res.json()).error || "Erreur");
  return res.json();
}

async function load() {
  if (RESTAURANT_CODE) {
    try {
      const res = await fetch(`/api/schedule/by-code/${RESTAURANT_CODE}`);
      if (!res.ok) throw new Error("Lien invalide");
      const data = await res.json();
      // Les droits viennent du serveur, jamais du code lu dans l'URL : c'est lui qui sait
      // quelle porte ce lien ouvre, et cacher un bouton ne protégerait rien tout seul.
      porte = {
        secteur: data.secteur === "cuisine" ? "cuisine" : "salle",
        peutModifier: data.peutModifier !== false,
        voitMontants: !!data.voitMontants,
        chargesPct: data.charges_pct || 0,
      };
      roster = { restaurants: [{ id: data.restaurant.id, name: data.restaurant.name, employees: data.employees }] };
      try {
        const shiftsRes = await fetch(`/api/schedule/by-code/${RESTAURANT_CODE}/shifts`);
        const shiftsData = await shiftsRes.json();
        shifts = shiftsData.shifts || [];
      } catch (e) {
        shifts = [];
      }
      render();
    } catch (e) {
      renderInvalidCode();
    }
    return;
  }
  try {
    roster = await api("/api/schedule/roster");
    try {
      const res = await api("/api/admin/shifts");
      shifts = res.shifts;
    } catch (e) {
      shifts = [];
    }
    render();
  } catch (e) {
    renderLogin();
  }
}

function renderInvalidCode() {
  document.getElementById("app").innerHTML = `
    <div class="error-box" style="margin:40px 20px; text-align:center; color:#E2685A;">
      <h2>${t("lienInvalideTitre")}</h2>
      <p>${t("lienInvalideMsg")}</p>
    </div>`;
}


function renderLogin(errorMsg) {
  document.getElementById("app").innerHTML = `
    <div class="login-screen">
      <div class="login-glow g1"></div>
      <div class="login-glow g2"></div>
      <button class="login-lang-toggle" id="langToggle">${lang === "fr" ? "EN" : "FR"}</button>
      <div class="login-content">
        <div class="login-brand">
          <span class="login-brand-mark">D</span>
          <span class="login-brand-name">Déclara</span>
        </div>
        <p class="login-tagline">${t("loginTagline")}</p>
        <div class="login-box">
          <h2>${icon("calendar", 12)}${t("accesHoraire")}</h2>
          <div class="login-field-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="pw" placeholder="${t("motDePasse")}" />
          </div>
          <button id="loginBtn">${t("entrer")}</button>
          ${errorMsg ? `<p style="color:#E2685A; font-size:12px; margin:12px 0 0;">${errorMsg}</p>` : ""}
        </div>
        <a class="login-back" href="/">${t("retourAccueil")}</a>
      </div>
    </div>`;
  document.getElementById("langToggle").addEventListener("click", () => setLang(lang === "fr" ? "en" : "fr"));
  document.getElementById("pw").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") document.getElementById("loginBtn").click();
  });
  document.getElementById("loginBtn").addEventListener("click", async () => {
    try {
      await login(document.getElementById("pw").value);
      await load();
    } catch (e) {
      renderLogin(e.message);
    }
  });
}




// Génère les options d'heure valides (5h à 22h, tranches de 15 min) — fiable sur tous les téléphones,
// contrairement au sélecteur natif <input type="time"> qui ignore parfois l'attribut step sur iOS.

// Copie tous les quarts de la semaine affichée vers la semaine suivante (mêmes employés,
// mêmes heures, même rôle), en sautant les cases déjà remplies pour ne rien écraser.

// Télécharge le PDF de la semaine affichée (lundi → dimanche). Le fichier est construit
// côté serveur, puis récupéré en blob : ça permet d'envoyer le jeton d'accès en en-tête,
// ce qu'un simple lien <a href> ne pourrait pas faire.

async function shiftApiCall(path, opts) {
  if (RESTAURANT_CODE) {
    const res = await fetch(`/api/schedule/by-code/${RESTAURANT_CODE}${path}`, {
      ...opts,
      headers: { "Content-Type": "application/json", ...(opts && opts.headers) },
    });
    if (!res.ok) throw new Error((await res.json()).error || "Erreur");
    return res.json();
  }
  return api(`/api/admin${path}`, opts);
}


function render() {
  let html = `
    <div class="schedule-header">
      <p class="title"><span class="title-mark">D</span>${t("dashboardTitle")}</p>
      <button class="lang-toggle" id="langToggle">${lang === "fr" ? "EN" : "FR"}</button>
    </div>
    <div class="content">
  `;
  roster.restaurants.forEach((r) => {
    html += `
      <div class="card">
        <div class="restaurant-title" style="font-size:19px; margin-bottom:14px;">${icon("calendar", 17, "margin-right:8px;")}${r.name}${porte.secteur === "cuisine" ? ` — ${t("cuisine")}` : ""}</div>
        ${r.employees.length === 0 ? `<p style="font-size:12px; color:#8993A4;">${t("aucunEmployePourHoraire")}</p>` : ScheduleUI.renderWeekGrid(r.id, r.employees, porte)}
      </div>
    `;
  });
  html += `</div>`;
  document.getElementById("app").innerHTML = html;

  document.getElementById("langToggle").addEventListener("click", () => setLang(lang === "fr" ? "en" : "fr"));
  ScheduleUI.bindGridEvents();
}

// Branche la grille partagée sur les données et l'API de CETTE page. Tout ce qui suit décrit
// uniquement ce qui distingue la page horaire de la page admin ; l'affichage est commun.
ScheduleUI.init({
  t,
  icon,
  lang: () => lang,
  restaurants: () => roster.restaurants,
  shifts: () => shifts,
  setShifts: (s) => { shifts = s; },
  reloadShifts: async () => {
    if (RESTAURANT_CODE) {
      const res = await fetch(`/api/schedule/by-code/${RESTAURANT_CODE}/shifts`);
      return (await res.json()).shifts;
    }
    return (await api("/api/admin/shifts")).shifts;
  },
  shiftApi: (path, opts) => shiftApiCall(path, opts),
  pdfRequest: (restaurantId, weekISO, langue) =>
    RESTAURANT_CODE
      ? { url: `/api/schedule/by-code/${RESTAURANT_CODE}/pdf?week=${weekISO}&lang=${langue}`, options: {} }
      : {
          url: `/api/admin/schedule/pdf?restaurantId=${encodeURIComponent(restaurantId)}&week=${weekISO}&lang=${langue}`,
          options: { headers: { "X-Admin-Token": TOKEN } },
        },
  rerender: () => render(),
});
ScheduleUI.bindShiftModal();

if (RESTAURANT_CODE) load();
else if (TOKEN) load();
else renderLogin();
// Tirer vers le bas depuis le haut de la page recharge les données, sans repartir de zéro.
TirerPourActualiser.init({
  libelle: (cle) => t(cle),
  surRafraichir: async () => {
    if (RESTAURANT_CODE || TOKEN) await load();
  },
});

</script>
</body>
</html>
