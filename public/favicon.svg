<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icône Déclara : le même D vert que l'en-tête de l'application.
       Carré arrondi #6FBF93, D serif italique sombre — proportions reprises de .title-mark
       (34 px de côté, 9 px de rayon, D de 18 px), transposées sur 64 px. -->
