          <div class="link-row">
            <div class="link-box">${origin}/horaire/${r.schedule_code_cuisine}</div>
            <button class="copy-btn" data-action="copyLink" data-link="${origin}/horaire/${r.schedule_code_cuisine}">${icon("copy", 13)} ${t("copier")}</button>
          </div>
          <div class="lien-avis">${icon("alert", 11, "margin-right:4px;")}${t("lienGerantCuisineAvis")}</div>
          <button class="lien-refaire" data-action="refaireLienCuisine" data-resto="${r.id}">${t("lienRefaire")}</button>
          <div class="mdp-bloc">
            <div class="mdp-etat ${r.mdp_cuisine_pose ? "pose" : "absent"}">
              ${icon(r.mdp_cuisine_pose ? "lock" : "alert", 11)} ${r.mdp_cuisine_pose ? t("mdpPose") : t("mdpAbsent")}
            </div>
            <div class="mdp-ligne">
              <input type="text" id="mdp-${r.id}" placeholder="${t("mdpChamp")}" autocomplete="off" />
              <button data-action="poserMdp" data-resto="${r.id}">${r.mdp_cuisine_pose ? t("mdpPoser") : t("mdpPoser")}</button>
            </div>
            <div class="mdp-aide">${t("mdpAide")}</div>
          </div>
        </div>
        <div style="margin:14px 0;">
          <div class="employee-stat-label" style="margin-bottom:4px;">${icon("calendar", 11, "margin-right:4px;")}${t("lienCuisiniers")}</div>
          <div class="link-row">
            <div class="link-box">${origin}/horaire/${r.schedule_code_cuisine_lecture}</div>
            <button class="copy-btn" data-action="copyLink" data-link="${origin}/horaire/${r.schedule_code_cuisine_lecture}">${icon("copy", 13)} ${t("copier")}</button>
          </div>
        </div>

        ${equipeCuisine.length === 0
          ? `<p style="font-size:12px; color:#8993A4;">${t("aucunEmployeCuisine")}</p>`
          : `<div class="lien-avis" style="color:#8993A4; margin-bottom:4px;">${t("heuresMaxAide")}</div>`}
        ${equipeCuisine.map((e) => `
          <div class="cuisine-row">
            <div>
              <div class="employee-name">${e.name} ${e.employee_number ? "· #" + e.employee_number : ""}${e.secteur === "les_deux" ? `<span class="marque-deux">${t("marqueLesDeux")}</span>` : ""}</div>
              <div class="employee-sub">${t("code")} : <b>${e.access_code}</b></div>
              <div class="link-row">
                <div class="link-box">${origin}/e/${e.access_code}</div>
                <button class="copy-btn" data-action="copyLink" data-link="${origin}/e/${e.access_code}">${icon("copy", 13)} ${t("copier")}</button>
              </div>
              <div class="lien-avis">${t("sousCuisine")}</div>
            </div>
            <div class="cuisine-taux">
              <div class="taux-paire">
                <div>
                  <label class="employee-stat-label" for="taux-${e.id}">${t("tauxHoraire")}</label>
                  <div class="taux-champ">
                    <input type="number" step="0.05" min="0" id="taux-${e.id}" class="tauxInput" data-emp="${e.id}" value="${e.taux_horaire || ""}" placeholder="0,00" />
                    <span>$/h</span>
                  </div>
                </div>
                <div>
                  <label class="employee-stat-label" for="hmax-${e.id}">${t("heuresMax")}</label>
                  <div class="taux-champ">
                    <input type="number" step="0.5" min="0" max="168" id="hmax-${e.id}" class="hmaxInput" data-emp="${e.id}" value="${e.heures_max || ""}" placeholder="—" />
                    <span>h</span>
                  </div>
                </div>
                <button class="copy-btn" data-action="saveTaux" data-emp="${e.id}">${t("enregistrerTaux")}</button>
              </div>
            </div>
            <div class="employee-row-actions">
              ${choixSecteurHTML(e)}
              <button class="secondary-btn" data-action="modifierEmploye" data-emp="${e.id}">${icon("edit", 12)} ${t("modifier")}</button>
              <button class="danger" data-action="delEmployee" data-id="${e.id}" style="font-size:10px; padding:3px 8px; height:fit-content;">${t("retirer")}</button>
            </div>
          </div>
          ${formEditionHTML(e)}
        `).join("")}

        <div class="add-form">
          <input type="text" placeholder="${t("nomEmployePlaceholder")}" data-restaurant="${r.id}" class="cuisName" />
          <input type="text" maxlength="20" placeholder="${t("numEmployePlaceholder")}" data-restaurant="${r.id}" class="cuisNumber" style="max-width:100px;" />
          <input type="number" step="0.05" min="0" placeholder="${t("tauxHoraire")}" data-restaurant="${r.id}" class="cuisTaux" style="max-width:120px;" />
          <button data-action="addCuisine" data-id="${r.id}">${t("ajouterEmploye")}</button>
        </div>

        <div class="charges-form">
          <label class="employee-stat-label" for="charges-${r.id}">${t("chargesEmployeur")}</label>
          <div class="taux-champ">
            <input type="number" step="0.5" min="0" max="100" id="charges-${r.id}" class="chargesInput" data-resto="${r.id}" value="${r.charges_pct || ""}" placeholder="0" />
            <span>%</span>
            <button class="copy-btn" data-action="saveCharges" data-resto="${r.id}">${t("enregistrerTaux")}</button>
          </div>
          <div class="lien-avis" style="margin-top:6px;">${t("chargesAide")}</div>
        </div>
      </div>
    `;

    if (onglet === "salle") {
      html += `
      <div class="card">
        <div class="restaurant-title" style="font-size:19px; margin-bottom:14px;">${icon("calendar", 17, "margin-right:8px;")}${r.name} — ${t("salle")}</div>
        ${equipeSalle.length === 0 ? `<p style="font-size:12px; color:#8993A4;">${t("aucunEmployePourHoraire")}</p>` : ScheduleUI.renderWeekGrid(r.id, equipeSalle, { secteur: "salle", avecHeures: true })}
      </div>`;
      return;
    }
    if (onglet === "cuisine") {
      // L'équipe de cuisine passe AVANT la grille — « monte ça en haut, en bas c'est pas
      // super ». Elle était sous une grille de quatorze rangées, donc hors de l'écran : il
      // fallait traverser tout l'horaire pour atteindre un lien, un taux ou le mot de passe.
      // Repliée, elle ne coûte qu'une ligne avant la grille, et c'est par elle qu'on entre
      // dans cet onglet quand on vient chercher autre chose qu'un quart.
      html += equipeCuisine.length === 0
        ? `<div class="card">${blocEquipeCuisine}</div>
           <div class="card"><div class="restaurant-title" style="font-size:19px; margin-bottom:14px;">${icon("chef", 17, "margin-right:8px;")}${r.name} — ${t("cuisine")}</div><p style="font-size:12px; color:#8993A4;">${t("aucunEmployePourHoraire")}</p></div>`
        : `
      <div class="card">${blocEquipeCuisine}</div>
      <div class="card">
        <div class="restaurant-title" style="font-size:19px; margin-bottom:14px;">${icon("chef", 17, "margin-right:8px;")}${r.name} — ${t("cuisine")}</div>
        ${ScheduleUI.renderWeekGrid(r.id, equipeCuisine, { secteur: "cuisine", voitMontants: true, chargesPct: r.charges_pct || 0 })}
      </div>`;
      return;
    }

    html += `
      <div class="card">
        <div class="restaurant-title">
          <span>${r.name}</span>
          <button class="danger" data-action="delRestaurant" data-id="${r.id}" style="font-size:11px; padding:4px 10px;">${t("supprimer")}</button>
        </div>
        <div class="restaurant-total">
          ${t("total")} : ${fmtMoney(totVentes)} ${t("ventes")} · <b style="color:#6FBF93">${fmtMoney(totNet)}</b> ${t("pourboireNet")}
        </div>
        <div style="margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.07);">
          <div class="employee-stat-label" style="margin-bottom:4px;">${icon("calendar", 11, "margin-right:4px;")}${t("lienHoraireLabel")}</div>
          <div class="link-row">
            <div class="link-box">${origin}/horaire/${r.schedule_code}</div>
            <button class="copy-btn" data-action="copyLink" data-link="${origin}/horaire/${r.schedule_code}">${icon("copy", 13)} ${t("copier")}</button>
          </div>
        </div>
    `;
    equipeSalle.forEach((e) => {
      const link = `${origin}/e/${e.access_code}`;
      const empPending = pendingByEmployee.find((p) => p.empId === e.id);
      html += `
        <div class="employee-card-block" id="emp-card-${e.id}">
          <button class="fiche-entete ${ficheOuverte(e.id) ? "ouverte" : ""}" data-action="toggleFiche" data-emp="${e.id}" aria-expanded="${ficheOuverte(e.id)}">
            <span class="fiche-fleche">${ficheOuverte(e.id) ? "▾" : "▸"}</span>
            <span class="fiche-nom">${e.name}${e.employee_number ? ` · #${e.employee_number}` : ""}${e.secteur === "les_deux" ? `<span class="marque-deux">${t("marqueLesDeux")}</span>` : ""}</span>
            <span class="fiche-resume">
              <b style="color:#6FBF93;">${fmtMoney(e.totals.net)}</b>
              ${empPending ? `<b style="color:${empPending.direction === "employer_owes" ? "#E2685A" : "#D4A857"};">${fmtMoney(empPending.amount)}</b>` : ""}
            </span>
          </button>
          <div class="fiche-corps" style="display:${ficheOuverte(e.id) ? "block" : "none"};">
          <div class="employee-row">
            <div>
              <div class="employee-sub">${t("code")} : <b>${e.access_code}</b></div>
              <div class="link-row">
                <div class="link-box">${link}</div>
                <button class="copy-btn" data-action="copyLink" data-link="${link}">${icon("copy", 13)} ${t("copier")}</button>
              </div>
            </div>
            <div class="employee-row-actions">
              <button class="secondary-btn" data-action="messageEmployee" data-id="${e.id}" data-name="${e.name}" data-resto="${r.name}">${icon("mail", 12)} ${t("messageTab")}</button>
              ${choixSecteurHTML(e)}
              <button class="secondary-btn" data-action="modifierEmploye" data-emp="${e.id}">${icon("edit", 12)} ${t("modifier")}</button>
              <button class="danger" data-action="delEmployee" data-id="${e.id}" style="font-size:10px; padding:3px 8px; height:fit-content;">${t("retirer")}</button>
            </div>
          </div>
          ${formEditionHTML(e)}
          <div class="plafond-form">
            <label class="employee-stat-label" for="hmax-salle-${e.id}">${t("heuresMax")}</label>
            <div class="taux-champ">
              <input type="number" step="0.5" min="0" max="168" id="hmax-salle-${e.id}" class="hmaxSalleInput" data-emp="${e.id}" value="${e.heures_max || ""}" placeholder="—" />
              <span>h</span>
              <button class="copy-btn" data-action="savePlafondSalle" data-emp="${e.id}">${t("enregistrerTaux")}</button>
            </div>
            <div class="lien-avis" style="margin-top:6px;">${t("plafondAide")}</div>
          </div>
          <div class="employee-stats">
            <div>
              <div class="employee-stat-label">${t("ventesTotales")}</div>
              <div class="employee-stat-value">${fmtMoney(e.totals.ventes)}</div>
            </div>
            <div>
              <div class="employee-stat-label">${t("pourboireNetTotal")}</div>
              <div class="employee-stat-value" style="color:#6FBF93;">${fmtMoney(e.totals.net)}</div>
            </div>
            <div>
              <div class="employee-stat-label">${t("pctMoyenLabel")}</div>
              <div class="employee-stat-value" style="color:#D4A857; font-size:16px;">${fmtPct(e.totals.pctMoyen)}</div>
            </div>
            ${empPending ? `
            <div>
              <div class="employee-stat-label">${t("enAttenteLabel")}</div>
              <div class="employee-stat-value" style="color:${empPending.direction === "employer_owes" ? "#E2685A" : "#D4A857"}; font-size:16px;">${fmtMoney(empPending.amount)}</div>
            </div>` : ""}
          </div>
          ${renderSparkline(e.entries)}
          <button class="report-toggle" data-action="toggleReport" data-emp="${e.id}">${icon("chart", 13)} ${t("voirDetail", e.entries.length)}</button>
          <div class="report-table-wrap" id="report-${e.id}" style="display:none;">
            ${e.entries.length === 0 ? `<p style="font-size:12px; color:#8993A4; padding:8px 0;">${t("aucuneJournee")}</p>` : `
            <table class="report-table">
              <thead>
                <tr>
                  <th>${t("thDate")}</th><th>${t("thDelai")}</th><th>${t("thVentes")}</th><th>${t("thClients")}</th><th>${t("thPct")}</th><th>${t("thRemis")}</th><th>${t("thNet")}</th><th>${t("thMoyCl")}</th><th>${t("thRecu")}</th><th>${t("thVirement")}</th><th>${t("thEffacer")}</th>
                </tr>
              </thead>
              <tbody>
                ${e.entries.map(d => {
                  const rowClass = d.remit_direction && !d.transferred
                    ? (d.remit_direction === "employer_owes" ? "row-flagged-owed-employee" : "row-flagged-owed-employer")
                    : "";
                  let virementCell = "—";
                  if (d.remit_direction) {
                    const isEmployerOwes = d.remit_direction === "employer_owes";
                    if (d.transferred) {
                      const statusLabel = isEmployerOwes ? t("vireOk", d.transfer_date || "") : t("recuOk", d.transfer_date || "");
                      virementCell = `<span class="transfer-done">${fmtMoney(d.remit_amount)} — ${statusLabel}</span>`;
                    } else {
                      const label = isEmployerOwes ? t("remitEmployerOwesShort") : t("remitEmployeeOwesShort");
                      const btnClass = isEmployerOwes ? "" : "owed-employer";
                      const btnLabel = isEmployerOwes ? t("marquerVire") : t("marquerRecu");
                      virementCell = `
                        <div style="font-size:9px; margin-bottom:1px; color:${isEmployerOwes ? "#E2685A" : "#D4A857"};">${label}</div>
                        <div style="font-size:12px; font-weight:800; margin-bottom:3px; color:${isEmployerOwes ? "#E2685A" : "#D4A857"};">${fmtMoney(d.remit_amount)}</div>
                        <button class="transfer-btn ${btnClass}" data-action="markTransferred" data-entry="${d.id}" data-direction="${d.remit_direction}">${btnLabel}</button>
                      `;
                    }
                  }
                  const delayDays = computeDelayDays(d);
                  const delayCell = delayDays === 0
                    ? `<span class="delay-badge delay-ok">${t("delaiOk")}</span>`
                    : `<span class="delay-badge ${delayDays >= 3 ? "delay-bad" : "delay-warn"}">${t("delaiJours", delayDays)}</span>`;
                  // « Non envoyée » reste volontairement gris et discret : les journées
                  // antérieures à cette fonction n'ont jamais pu être envoyées, et les
                  // peindre en rouge ferait croire à un retard qui n'existe pas.
                  const sentBadge = d.submitted_at
                    ? `<div class="sent-badge sent">${t("journeeEnvoyee")}</div>`
                    : `<div class="sent-badge unsent">${t("journeeNonEnvoyee")}</div>`;
                  const modifiedBadge = wasModified(d)
                    ? `<div class="modified-badge">${icon("edit", 11)} ${t("modifieLe", fmtModifiedDate(d.data_updated_at))}</div>`
                    : "";
                  return `

function fmtMsgDate(iso) {
  if (!iso) return "";
  // iso vient de SQLite au format 'YYYY-MM-DD HH:MM:SS' (UTC) — on le rend lisible.
  const d = new Date(iso.replace(" ", "T") + "Z");
  return d.toLocaleString(t("locale"), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

function groupMessagesByEmployee() {
  const byEmployee = {};
  messages.forEach((m) => {
    if (!byEmployee[m.employee_id]) {
      byEmployee[m.employee_id] = {
        employeeId: m.employee_id,
        employeeName: m.employee_name,
        restaurantName: m.restaurant_name,
        messages: [],
      };
    }
    byEmployee[m.employee_id].messages.push(m);
  });
  const threads = Object.values(byEmployee);
  // chaque messages[] vient déjà trié DESC (le plus récent en premier) depuis le serveur
  threads.forEach((t) => {
    t.lastMessage = t.messages[0];
    t.unreadCount = t.messages.filter((m) => m.sender === "employee" && !m.is_read).length;
  });
  threads.sort((a, b) => new Date(b.lastMessage.created_at) - new Date(a.lastMessage.created_at));
  return threads;
}

function renderMessagesInbox() {
  const container = document.getElementById("messagesInbox");
  if (!container) return;
  const threads = groupMessagesByEmployee();
  const totalUnread = threads.reduce((s, t) => s + t.unreadCount, 0);

  container.innerHTML = `
    <button class="messages-toggle" id="messagesToggleBtn">
      <span class="icn-circle">${icon("inbox", 18)}</span>
      <span>${t("messagesTitle")} ${totalUnread > 0 ? `<span class="unread-badge">${totalUnread}</span>` : ""}</span>
    </button>
    <div id="messagesList" style="display:none; margin-top:12px;">
      ${threads.length === 0 ? `<p style="font-size:12px; color:#8993A4;">${t("aucunMessage")}</p>` : threads.map((th) => `
        <button class="thread-row" data-action="openThread" data-emp="${th.employeeId}">
          <div class="thread-row-top">
            <span class="thread-name">${th.employeeName} <span class="thread-resto">· ${th.restaurantName}</span></span>
            ${th.unreadCount > 0 ? `<span class="unread-badge">${th.unreadCount}</span>` : ""}
          </div>

async function openThreadModal(employeeId, employeeName, restaurantName) {
  const overlay = document.getElementById("threadModalOverlay");
  overlay.style.display = "flex";
  overlay.dataset.emp = employeeId;
  document.getElementById("threadReplyBody").value = "";
  document.getElementById("threadReplyBody").placeholder = t("repondrePlaceholder");
  document.getElementById("deleteThreadBtn").textContent = t("supprimerConversation");
  document.getElementById("threadReplySendBtn").textContent = t("messageSend");
  renderThreadMessages(employeeId);

  const thread = threads.find((th) => th.employeeId === employeeId);
  if (thread) {
    document.getElementById("threadModalTitle").textContent = `${thread.employeeName} · ${thread.restaurantName}`;

function closeThreadModal() {

}

function renderThreadMessages(employeeId) {
  const wrap = document.getElementById("threadMessages");
  const empMessages = messages.filter((m) => m.employee_id === employeeId).slice().reverse(); // ordre chronologique ASC pour l'affichage
  wrap.innerHTML = empMessages.map((m) => `
    <div class="conv-bubble ${m.sender === "admin" ? "conv-admin" : "conv-employee"}">
      <div class="conv-sender">${m.sender === "admin" ? t("toiLabel") : m.employee_name}</div>
      <div class="conv-body">${m.body.replace(/</g, "&lt;")}</div>
      <button class="conv-delete-btn" data-action="deleteThreadMessage" data-id="${m.id}">${t("supprimerMessage")}</button>
    </div>
  `).join("");
  wrap.scrollTop = wrap.scrollHeight;

  wrap.querySelectorAll('[data-action="deleteThreadMessage"]').forEach((btn) => {

      messages = messages.filter((m) => m.id !== btn.dataset.id);

    });

}

function csvEscape(val) {
  const s = String(val ?? "");
  if (s.includes(",") || s.includes('"') || s.includes("\n")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

// Télécharge une sauvegarde complète (base de données + versions lisibles + photos).
// On passe par un blob plutôt que par un lien direct, pour pouvoir envoyer le jeton admin.
async function downloadBackup(btn) {
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = t("sauvegardeEnCours");
  let objectUrl = null;
  try {
    const res = await fetch("/api/admin/backup", { headers: { "X-Admin-Token": TOKEN } });
    if (!res.ok) throw new Error("backup");
    const blob = await res.blob();

    const match = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "");
    const filename = match ? match[1] : "sauvegarde.zip";

    objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    // On annonce ce que contient la sauvegarde : le gérant doit pouvoir constater
    // qu'elle n'est pas vide sans avoir à ouvrir le fichier.
    const entete = res.headers.get("X-Backup-Summary");
    if (entete) alert(t("sauvegardeFaite", JSON.parse(decodeURIComponent(entete))));
  } catch (e) {
    alert(t("sauvegardeErreur"));
  } finally {
    if (objectUrl) setTimeout(() => URL.revokeObjectURL(objectUrl), 15000);
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
}

// L'export CSV, tel qu'il s'ouvre dans Numbers ou Excel.
//
// Quatre défauts rapportés en le lisant sur un iPad, avec une vraie équipe :
//
//   1. Il listait TOUT l'effectif. Un cuisinier ne déclare jamais, une serveuse peut n'avoir
//      rien déclaré dans la période — ils avaient quand même leur ligne de zéros. Sur le
//      rapport du propriétaire : 26 lignes pour 2 personnes qui avaient déclaré.
//   2. Les lignes SOUS-TOTAL perdaient le numéro d'employé et le nom du restaurant, alors
//      qu'ils sont bien enregistrés. Trié ou filtré dans Numbers, un sous-total n'avait plus
//      d'identité.
//   3. La colonne « Moy./client » voulait dire DEUX choses : ventes ÷ clients sur une
//      journée (la facture moyenne), pourboire net ÷ clients sur un sous-total. 17,48 $ sur
//      la ligne, 1,73 $ sur son propre sous-total. Un chiffre faux est pire qu'un chiffre
//      absent.
//   4. Une personne avec UNE seule journée recevait quand même un SOUS-TOTAL qui répétait
//      exactement cette journée. Un sous-total d'une ligne ne totalise rien.
//
// La moyenne par client est donc calculée partout comme `Math.moyenne` le fait dans
// tip-math.js — ventes ÷ clients. C'est la définition qui a cours dans tout le reste de
// l'app ; en avoir une deuxième ici était l'erreur.
// ---------------------------------------------------------------- voir un relevé photo
//
// La vignette ouvrait l'image brute dans un nouvel onglet (`target="_blank"`). Sur un
// téléphone — surtout quand l'app est ajoutée à l'écran d'accueil, ce que ce dépôt prévoit
// avec `apple-mobile-web-app-title` — cet onglet s'affiche sans barre de navigateur : ni
// bouton fermer, ni flèche retour. « Quand j'ouvre une photo pour valider dans mon admin il
// n'y a pas de bouton fermer sur mon cell. »
//
// La fenêtre vit donc DANS la page, et se ferme de trois façons : le gros bouton, une tape à
// côté de l'image, et la touche Échap sur un ordinateur.
function ouvrirPhoto(fichier, jour) {
  document.getElementById("photoJour").textContent = jour ? `${t("photoTitre")} · ${jour}` : t("photoTitre");
  document.getElementById("photoGrande").src = `/api/photos/${fichier}`;
  document.getElementById("photoFermerBtn").textContent = t("photoFermer");
  document.getElementById("photoOverlay").style.display = "flex";
}

function fermerPhoto() {
  document.getElementById("photoOverlay").style.display = "none";
  // On vide la source : sans ça, l'image reste en mémoire et la prochaine ouverture montre
  // brièvement la PRÉCÉDENTE, le temps que la nouvelle se charge. Sur un relevé qu'on valide,
  // voir une seconde la photo de quelqu'un d'autre est franchement trompeur.
  document.getElementById("photoGrande").removeAttribute("src");
}

// ---------------------------------------------------------------- corriger une journée
//
// Le gérant pouvait effacer une journée déclarée mais pas la réparer. Pour une coquille —
// 1 240 $ tapé 12 400 — il fallait rejoindre l'employée et lui expliquer où taper, ou tout
// effacer et lui demander de recommencer.
//
// L'état vit au niveau du module, comme `fichesOuvertes` : `render()` reconstruit toute la
// page, et un identifiant posé sur un nœud ne survivrait pas au premier rafraîchissement.
let journeeEnCorrection = null;

function journeeParId(entryId) {
  for (const r of (overview && overview.restaurants) || [])
    for (const e of r.employees || [])
      for (const d of e.entries || []) if (d.id === entryId) return { employe: e, journee: d };
  return null;
}

// Le net affiché pendant la frappe. Il passe par TipMath — la même fonction que le serveur —
// parce que ce calcul a déjà existé en double dans ce dépôt et que les deux versions avaient
// divergé en silence : l'écran montrait un montant, la base en gardait un autre.
function majNetCorrection() {
  const lu = (id) => document.getElementById(id).value;
  const calcule = TipMath.computeEntry({ ventes: lu("entryVentes"), clients: lu("entryClients"), pct: lu("entryPct"), remis: lu("entryRemis") });
  const boite = document.querySelector(".entry-net");
  document.getElementById("entryNet").textContent = fmtMoney(calcule.net);
  // Un net négatif est un cas réel — elle a remis plus que son pourboire brut — mais il doit
  // se voir : en vert, il se lirait comme une somme qu'elle a gagnée.
  boite.classList.toggle("negatif", calcule.net < 0);
}

function majSensCorrection(sens) {
  for (const b of document.querySelectorAll(".entry-sens button")) b.classList.toggle("actif", b.dataset.sens === (sens || ""));
  // Sans sens de virement il n'y a pas de montant : le champ disparaît plutôt que de rester
  // là avec un chiffre qui ne compte plus.
  document.getElementById("entryMontant").style.display = sens ? "block" : "none";
}

function ouvrirCorrection(entryId) {
  const trouve = journeeParId(entryId);
  if (!trouve) return;
  const { employe, journee } = trouve;
  journeeEnCorrection = { id: entryId, netAvant: journee.net };

  document.getElementById("entryModalTitle").textContent = t("corrigerTitre");
  document.getElementById("entryModalQui").textContent = `${employe.name} · ${fmtDateLong(journee.date)}`;
  for (const [id, cle] of [["lblVentes", "champVentes"], ["lblClients", "champClients"], ["lblPct", "champPct"],
                           ["lblRemis", "champRemis"], ["lblNet", "champNet"], ["lblVirement", "champVirement"],
                           ["lblHotesse", "champHotesse"], ["sensAucun", "sensAucun"],
                           ["sensElleDoit", "sensElleDoit"], ["sensJeDois", "sensJeDois"],
                           ["entrySaveBtn", "corrigerEnregistrer"], ["entryCancelBtn", "corrigerAnnuler"]])
    document.getElementById(id).textContent = t(cle);

  document.getElementById("entryVentes").value = journee.ventes || 0;
  document.getElementById("entryClients").value = journee.clients || 0;
  document.getElementById("entryPct").value = journee.pct || 0;
  document.getElementById("entryRemis").value = journee.remis || 0;
  document.getElementById("entryMontant").value = journee.remit_amount || 0;
  document.getElementById("entryHotesse").checked = !!journee.is_hotesse;
  document.getElementById("entryAvant").textContent = t("netAvant", fmtMoney(journee.net));

  // L'avertissement : les chiffres se recalculent, l'argent déjà viré entre deux personnes
  // non. C'est le piège qu'on veut fermer avant la tape, pas après.
  const avis = document.getElementById("entryVireAvis");
  if (journee.transferred && journee.remit_amount) {
    // Les deux textes sortent de nos dictionnaires et d'un montant formaté : on les pose en
    // TEXTE et pas en HTML, pour ne pas ouvrir un chemin d'injection là où il n'en faut pas.
    const titre = document.createElement("b");
    titre.textContent = `⚠ ${t("vireDejaRecu", fmtMoney(journee.remit_amount))}`;
    const suite = document.createElement("span");
    suite.textContent = t("vireDejaRecuSuite");
    avis.replaceChildren(titre, suite);
    avis.style.display = "block";
  } else {
    avis.style.display = "none";
  }

  majSensCorrection(journee.remit_direction || "");
  majNetCorrection();
  // Le bouton se réarme À L'OUVERTURE, et pas seulement quand un envoi échoue.
  // Le bogue vécu : « ça marchait pour une mais l'autre s'enregistre pas quand j'appuie
  // sur le piton ». L'enregistrement désactive le bouton le temps de l'aller-retour, et ne
  // le réactivait que dans le `catch`. Une correction RÉUSSIE le laissait donc désactivé
  // pour toujours — la fenêtre se rouvrait normalement, les champs se remplissaient,
  // et taper « Enregistrer » ne faisait plus rien, sans un mot d'explication.
  document.getElementById("entrySaveBtn").disabled = false;
  document.getElementById("entryModalOverlay").style.display = "flex";
}

function fermerCorrection() {
  document.getElementById("entryModalOverlay").style.display = "none";
  journeeEnCorrection = null;
}

async function enregistrerCorrection() {
  if (!journeeEnCorrection) return;
  const bouton = document.getElementById("entrySaveBtn");
  const actif = document.querySelector(".entry-sens button.actif");
  const sens = actif ? actif.dataset.sens : "";
  bouton.disabled = true;
  try {
    await api(`/api/admin/entries/${journeeEnCorrection.id}`, {
      method: "PATCH",
      body: JSON.stringify({
        ventes: document.getElementById("entryVentes").value,
        clients: document.getElementById("entryClients").value,
        pct: document.getElementById("entryPct").value,
        remis: document.getElementById("entryRemis").value,
        remit_direction: sens || null,
        remit_amount: document.getElementById("entryMontant").value,
        is_hotesse: document.getElementById("entryHotesse").checked,
      }),
    });
  } catch (e) {
    // On ne vide ni ne referme : il vient de taper ses chiffres, et laisser croire que
    // c'est passé est pire que de le dire. Même règle que la page de l'employée.
    bouton.disabled = false;
    alert(e.message || "Erreur");
    return;
  }
  fermerCorrection();
  await load();
}

function moyenneParClient(ventes, clients) {
  return clients > 0 ? ventes / clients : 0;
}

/**
 * Une journée d'HÔTESSE n'est pas une journée de vente.
 *
 * Sur une journée cochée « hôtesse », la colonne `ventes` ne contient pas des ventes : elle
 * contient le MONTANT REÇU DES SERVEUSES, c'est le libellé du champ sur sa page. Et ses
 * clients valent 0, parce qu'elle n'en sert pas.
 *
 * L'export additionnait tout ça dans la colonne « Ventes $ » : sur une semaine d'essai,
 * 773 $ de pourboires remis se retrouvaient comptés comme des ventes du restaurant. Le même
 * argent est déjà compté une fois chez les serveuses, dans « Remis employés ».
 *
 * Les colonnes qui parlent de VENTES et de CLIENTS ne regardent donc que les journées de
 * service. Ce qu'une hôtesse a reçu vit dans sa propre colonne, et dans son pourboire net —
 * qui, lui, est juste : son brut vaut ce qu'elle a reçu, et elle ne remet rien.
 */
function estJourneeHotesse(d) {
  return !!d.is_hotesse;
}

// Les totaux d'une personne (ou d'un restaurant) sur une période.
function totauxDe(entries) {
  const s = { jours: 0, ventes: 0, clients: 0, remis: 0, brut: 0, net: 0,
              recuHotesse: 0, duParMoi: 0, dejaVire: 0, duParLui: 0 };
  for (const d of entries) {
    s.jours++;
    s.brut += d.pourboireBrut;
    s.net += d.net;
    if (estJourneeHotesse(d)) {
      s.recuHotesse += d.ventes;
    } else {
      s.ventes += d.ventes;
      s.clients += d.clients;
      s.remis += d.remis;
    }
    if (d.remit_direction === "employer_owes") {
      s.duParMoi += d.remit_amount || 0;
      if (d.transferred) s.dejaVire += d.remit_amount || 0;
    }
    // « Il me doit » ne compte que ce qui n'est pas réglé : une fois reçu, ce n'est plus dû.
    if (d.remit_direction === "employee_owes" && !d.transferred) s.duParLui += d.remit_amount || 0;
  }
  return s;
}

function ligneResume(nomResto, nom, numero, s) {
  const pct = s.ventes > 0 ? (s.brut - s.recuHotesse) / s.ventes * 100 : 0;
  // Un tiret plutôt qu'un zéro quand la personne n'a fait que de l'hôtesse : « 0,00 » dans
  // une colonne de moyenne se lit comme un chiffre, pas comme une absence de chiffre.
  const siVentes = (v) => (s.ventes > 0 ? v : "—");
  return [
    nomResto, nom, numero || "", String(s.jours),
    siVentes(s.ventes.toFixed(2)),
    siVentes(String(s.clients)),
    siVentes(pct.toFixed(1)),
    s.remis.toFixed(2),
    s.recuHotesse > 0 ? s.recuHotesse.toFixed(2) : "",
    s.brut.toFixed(2),
    s.net.toFixed(2),
    siVentes(moyenneParClient(s.ventes, s.clients).toFixed(2)),
    s.duParMoi.toFixed(2),
    s.dejaVire.toFixed(2),
    (s.duParMoi - s.dejaVire).toFixed(2),
    s.duParLui.toFixed(2),
  ];
}

/**
 * Le rapport qu'on sort neuf fois sur dix : UNE ligne par personne.
 *
 * Le détaillé donne une ligne par journée. Sur une semaine normale — douze personnes, quatre
 * à six journées chacune — ça fait 84 lignes à lire sur un iPad. « C'est trop lourd toutes
 * les journées. »
 *
 * Et il manquait l'essentiel : les lignes SOUS-TOTAL laissaient vides les colonnes d'argent,
 * donc « combien je dois à Marie-Eve en tout » et « combien il me reste à virer » n'étaient
 * totalisés NULLE PART. Il fallait additionner les 84 lignes à la main. Ces deux chiffres
 * sont la raison d'être du rapport.
 */
function exportResumeCSV() {
  const rows = [t("csvHeadersResume")];
  overview.restaurants.forEach((r) => {
    const declarants = r.employees.filter((e) => e.entries.length > 0);
    if (declarants.length === 0) return;
    const toutes = [];
    declarants.forEach((e) => {
      rows.push(ligneResume(r.name, e.name, e.employee_number, totauxDe(e.entries)));
      toutes.push(...e.entries);
    });
    rows.push(ligneResume(r.name, t("csvTotalRestaurant"), "", totauxDe(toutes)));
    rows.push([]);
  });
  telechargerCSV(rows, t("nomFichierResume"));
}

// Le téléchargement lui-même, partagé par les deux exports.
function telechargerCSV(rows, prefixe) {
  const csvContent = rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const { start, end } = resolvePeriod();
  const suffix = period.mode === "all" ? t("tout") : `${start}_${lang === "fr" ? "au" : "to"}_${end}`;
  const a = document.createElement("a");
  a.href = url;
  a.download = `${prefixe}-${suffix}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCSV() {
  const rows = [t("csvHeaders")];

  overview.restaurants.forEach((r) => {
    const restoTotals = { ventes: 0, clients: 0, remis: 0, brut: 0, net: 0 };
    // Un restaurant dont personne n'a déclaré ne produit RIEN — pas même un
    // « TOTAL RESTAURANT 0,00 », qui se lirait comme un commerce sans ventes.
    const declarants = r.employees.filter((e) => e.entries.length > 0);
    if (declarants.length === 0) return;

    declarants.forEach((e) => {
      const empTotals = { ventes: 0, clients: 0, remis: 0, brut: 0, net: 0 };

      e.entries.forEach((d) => {
        const directionLabel =
          d.remit_direction === "employer_owes" ? t("csvEmployerOwes") :
          d.remit_direction === "employee_owes" ? t("csvEmployeeOwes") :
          t("csvNone");
        rows.push([
          r.name,
          e.name,
          e.employee_number || "",
          d.date,
          d.ventes.toFixed(2),
          d.clients,
          d.pct.toFixed(1),
          d.remis.toFixed(2),
          d.pourboireBrut.toFixed(2),
          d.net.toFixed(2),
          d.moyenne.toFixed(2),
          directionLabel,
          d.remit_direction ? (d.remit_amount || 0).toFixed(2) : "",
          d.remit_direction ? (d.transferred ? t("csvOui") : t("csvNon")) : "",
          d.transferred ? (d.transfer_date || "") : "",
        ]);
        empTotals.ventes += d.ventes;
        empTotals.clients += d.clients;
        empTotals.remis += d.remis;
        empTotals.brut += d.pourboireBrut;
        empTotals.net += d.net;
      });

      // Sous-total de l'employé — sauté quand il n'a qu'UNE journée : la ligne répéterait
      // mot pour mot celle du dessus.
      if (e.entries.length > 1) {
        const empPctMoyen = empTotals.ventes > 0 ? (empTotals.brut / empTotals.ventes) * 100 : 0;
        rows.push([
          // Le restaurant et le numéro suivent le sous-total : sans eux, une ligne triée ou
          // filtrée dans Numbers ne dit plus de qui elle parle.
          r.name, t("csvSousTotal") + " " + e.name, e.employee_number || "", "",
          empTotals.ventes.toFixed(2),
          empTotals.clients,
          empPctMoyen.toFixed(1),
          empTotals.remis.toFixed(2),
          empTotals.brut.toFixed(2),
          empTotals.net.toFixed(2),
          moyenneParClient(empTotals.ventes, empTotals.clients).toFixed(2),
          "", "", "", "",
        ]);
      }

      restoTotals.ventes += empTotals.ventes;
      restoTotals.clients += empTotals.clients;
      restoTotals.remis += empTotals.remis;
      restoTotals.brut += empTotals.brut;
      restoTotals.net += empTotals.net;
    });

    // Total du restaurant au complet (tous les employés additionnés)
    const restoPctMoyen = restoTotals.ventes > 0 ? (restoTotals.brut / restoTotals.ventes) * 100 : 0;
    rows.push([
      r.name, t("csvTotalRestaurant"), "", "",
      restoTotals.ventes.toFixed(2),
      restoTotals.clients,
      restoPctMoyen.toFixed(1),
      restoTotals.remis.toFixed(2),
      restoTotals.brut.toFixed(2),
      restoTotals.net.toFixed(2),
      moyenneParClient(restoTotals.ventes, restoTotals.clients).toFixed(2),
      "", "", "", "",
    ]);
    rows.push([]); // ligne vide pour bien séparer visuellement chaque restaurant
  });

  telechargerCSV(rows, t("nomFichierDetail"));
}

function openTransferModal(entryId, direction) {
  const overlay = document.getElementById("modalOverlay");
  const dateInput = document.getElementById("modalDate");
  document.getElementById("modalTitle").textContent =
    direction === "employer_owes" ? t("confirmTransferTitle") : t("confirmReceptionTitle");
  document.getElementById("modalMsg").textContent =
    direction === "employer_owes" ? t("confirmTransferMsg") : t("confirmTransferMsgReceived");
  dateInput.value = todayISO();
  document.getElementById("modalCancel").textContent = t("annulerBtn");
  document.getElementById("modalConfirm").textContent = t("confirmerBtn");
  overlay.style.display = "flex";

  const cancelBtn = document.getElementById("modalCancel");
  const confirmBtn = document.getElementById("modalConfirm");

  const close = () => { overlay.style.display = "none"; };
  const onCancel = () => { close(); cleanup(); };
  const onConfirm = async () => {
    await api(`/api/admin/entries/${entryId}/transferred`, {
      method: "POST",
      body: JSON.stringify({ transferred: true, transfer_date: dateInput.value }),
    });
    close();
    cleanup();

  };
  function cleanup() {
    cancelBtn.removeEventListener("click", onCancel);
    confirmBtn.removeEventListener("click", onConfirm);
  }
  cancelBtn.addEventListener("click", onCancel);
  confirmBtn.addEventListener("click", onConfirm);
}

function setupThreadModal() {
  const overlay = document.getElementById("threadModalOverlay");
  document.getElementById("threadModalCloseX").addEventListener("click", closeThreadModal);
  overlay.addEventListener("click", (ev) => {
    if (ev.target === overlay) closeThreadModal();
  });
  document.getElementById("deleteThreadBtn").addEventListener("click", async () => {
    const employeeId = overlay.dataset.emp;
    if (!employeeId) return;
    const hasMessages = messages.some((m) => m.employee_id === employeeId);
    if (!hasMessages) { closeThreadModal(); return; }
    if (!confirm(t("confirmSupprimerConversation"))) return;
    try {
      await api(`/api/admin/employees/${employeeId}/messages`, { method: "DELETE" });
      messages = messages.filter((m) => m.employee_id !== employeeId);
      closeThreadModal();
      renderMessagesInbox();
    } catch (err) {
      alert(t("erreurEnvoiReponse"));
    }
  });
  document.getElementById("threadReplySendBtn").addEventListener("click", async () => {
    const employeeId = overlay.dataset.emp;
    const textarea = document.getElementById("threadReplyBody");
    const body = textarea.value.trim();
    if (!body || !employeeId) return;
    const btn = document.getElementById("threadReplySendBtn");
    const originalText = btn.textContent;
    btn.textContent = "…";
    btn.disabled = true;
    try {
      await api(`/api/admin/employees/${employeeId}/messages`, { method: "POST", body: JSON.stringify({ body }) });
      const res = await api("/api/admin/messages");
      messages = res.messages;
      textarea.value = "";
      renderThreadMessages(employeeId);
      renderMessagesInbox();
    } catch (err) {
      alert(t("erreurEnvoiReponse"));
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });
}
setupThreadModal();

// Branche la grille partagée sur les données et l'API de CETTE page. Tout ce qui suit décrit
// uniquement ce qui distingue le tableau de bord admin de la page horaire ; l'affichage est commun.
ScheduleUI.init({
  t,
  icon,
  lang: () => lang,
  restaurants: () => overview.restaurants,
  shifts: () => shifts,
  setShifts: (s) => { shifts = s; },
  reloadShifts: async () => (await api("/api/admin/shifts")).shifts,
  absences: () => absences,
  setAbsences: (a) => { absences = a; },
  reloadAbsences: async () => (await api("/api/admin/absences")).absences,
  disponibilites: () => disponibilites,
  shiftApi: (path, opts) => api(`/api/admin${path}`, opts),
  pdfRequest: (restaurantId, weekISO, langue, secteur) => ({
    url: `/api/admin/schedule/pdf?restaurantId=${encodeURIComponent(restaurantId)}&week=${weekISO}&lang=${langue}${secteur ? `&secteur=${secteur}` : ""}`,
    options: { headers: { "X-Admin-Token": TOKEN } },
  }),
  rerender: () => render(),
});
ScheduleUI.bindShiftModal();

// La fenêtre de correction vit hors de #app, comme celle des quarts : ses écouteurs se
// posent UNE fois. Les rebrancher dans render() en empilerait un de plus à chaque
// rafraîchissement, et un enregistrement partirait en double.
document.getElementById("photoFermerBtn").addEventListener("click", fermerPhoto);
document.getElementById("photoOverlay").addEventListener("click", (e) => {
  // Une tape À CÔTÉ ferme ; une tape SUR l'image ne ferme pas, sinon on la perd en voulant
  // la regarder de plus près.
  if (e.target.id === "photoOverlay") fermerPhoto();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("photoOverlay").style.display === "flex") fermerPhoto();
});
document.getElementById("entryModalCloseX").addEventListener("click", fermerCorrection);
document.getElementById("entryCancelBtn").addEventListener("click", fermerCorrection);
document.getElementById("entrySaveBtn").addEventListener("click", enregistrerCorrection);
document.getElementById("entryModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "entryModalOverlay") fermerCorrection();
});
for (const champ of ["entryVentes", "entryClients", "entryPct", "entryRemis"])
  document.getElementById(champ).addEventListener("input", majNetCorrection);
for (const bouton of document.querySelectorAll(".entry-sens button"))
  bouton.addEventListener("click", () => majSensCorrection(bouton.dataset.sens));

if (TOKEN) load(); else renderLogin();
// Tirer vers le bas depuis le haut de la page recharge les données, sans repartir de zéro.
TirerPourActualiser.init({
  libelle: (cle) => t(cle),
  surRafraichir: async () => {
    if (TOKEN) await load();
  },
});

// La fenêtre de rappel avant un férié. Elle sort une fois par ouverture de l'app, et
// seulement quand un férié approche — voir alerte-ferie.js pour le pourquoi du moment choisi.
if (TOKEN) {
  AlerteFerie.init({
    lang: () => lang,
    charger: async () => (await api("/api/admin/rappels")).restaurants,
    enregistrer: (id, rappels) =>
      api(`/api/admin/restaurants/${id}/rappels`, { method: "POST", body: JSON.stringify({ rappels }) }),
  });
}
