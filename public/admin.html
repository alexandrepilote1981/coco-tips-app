<style>

  body { margin: 0; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

  }

  /* ---------- Horaire : grille hebdomadaire ---------- */

<div id="app"></div>
<div id="modalOverlay" class="modal-overlay" style="display:none;">

    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <input type="date" id="modalDate" />
    <div class="modal-actions">
      <button class="secondary" id="modalCancel"></button>
      <button id="modalConfirm"></button>

let lang = localStorage.getItem("coco-lang-admin") || "fr";
function t(key, ...args) {
  const val = I18N[lang][key];
  return typeof val === "function" ? val(...args) : val;
}
function setLang(l) {
  lang = l;
  localStorage.setItem("coco-lang-admin", l);
  document.documentElement.lang = l;
  if (overview) render(); else renderLogin();
}

function localISO(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}
function todayISO() { return localISO(new Date()); }
function isoDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return localISO(d);
}

function resolvePeriod() {
  if (period.mode === "2w") return { start: isoDaysAgo(13), end: todayISO() };
  if (period.mode === "month") return { start: isoDaysAgo(29), end: todayISO() };
  if (period.mode === "all") return { start: null, end: null };
  return { start: period.start, end: period.end }; // custom
}

async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Admin-Token": TOKEN, ...(opts && opts.headers) },
  });
  if (!res.ok) throw new Error((await res.json()).error || "Erreur");
  return res.json();
}

function fmtMoney(n) { n = isFinite(n) ? n : 0; return n.toLocaleString(t("locale"), { style: "currency", currency: "CAD" }); }

// Un vrai petit graphique (pas juste des chiffres) : les pourboires nets des derniers jours,
// en ordre chronologique, pour repérer une tendance d'un coup d'œil.
function renderSparkline(entries) {
  if (!entries || entries.length < 2) return "";
  const recent = entries.slice(0, 8).slice().reverse(); // entries arrive déjà triées DESC -> on remet en ordre chronologique
  const values = recent.map((e) => e.net || 0);
  const max = Math.max(...values.map(Math.abs), 1);
  const barW = 10;
  const gap = 6;
  const chartH = 36;
  const width = recent.length * (barW + gap) - gap;
  const bars = values.map((v, i) => {
    const h = Math.max(2, (Math.abs(v) / max) * chartH);
    const x = i * (barW + gap);
    const y = v >= 0 ? chartH - h : chartH;
    return `<rect class="sparkline-bar${v < 0 ? " negative" : ""}" x="${x}" y="${y}" width="${barW}" height="${h}" rx="2"/>`;
  }).join("");
  return `
    <div class="sparkline-wrap">
      <div class="sparkline-label">${t("tendanceRecente")}</div>
      <svg width="${width}" height="${chartH}" viewBox="0 0 ${width} ${chartH}">${bars}</svg>
    </div>
  `;
}
function fmtPct(n) { n = isFinite(n) ? n : 0; return (n * 100).toFixed(1) + "%"; }

// Formate une heure "HH:MM" pour l'affichage (garde le format 24h, simple et sans ambiguïté)
function fmtTime(t) { return t || ""; }

// ---------- Horaire : grille hebdomadaire ----------
let weekStart = getMonday(new Date());

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0=dimanche .. 6=samedi
  const diff = day === 0 ? -6 : 1 - day; // recule jusqu'au lundi de cette semaine
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function isoDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function weekDates(start) { return Array.from({ length: 7 }, (_, i) => addDays(start, i)); }
function fmtWeekLabel(start) {
  const end = addDays(start, 6);
  const optsShort = { day: "numeric" };
  const optsFull = { day: "numeric", month: "long" };
  const startStr = start.toLocaleDateString(t("locale"), optsShort);
  const endStr = end.toLocaleDateString(t("locale"), optsFull);
  return t("semaineDu", startStr, endStr);
}

const ROLES = {
  server: { fr: "Serveur", en: "Server" },
  hostess: { fr: "Hôtesse", en: "Host" },
};

function renderWeekGrid(restaurantId, employees) {
  const dates = weekDates(weekStart);
  const todayStr = todayISO();
  return `
    <div class="week-header">
      <div class="week-title">${fmtWeekLabel(weekStart)}</div>
      <div class="week-nav">
        <button data-action="prevWeek" data-resto="${restaurantId}">‹</button>
        <button data-action="thisWeek" data-resto="${restaurantId}">${t("aujourdhui")}</button>
        <button data-action="nextWeek" data-resto="${restaurantId}">›</button>
      </div>
    </div>
    <div class="week-grid" style="grid-template-columns: 96px repeat(7, 1fr);">
      <div></div>
      ${dates.map((d) => `
        <div class="day-head ${isoDate(d) === todayStr ? "today" : ""}">
          <div class="dow">${d.toLocaleDateString(t("locale"), { weekday: "short" })}</div>
          <div class="dnum">${d.getDate()}</div>
        </div>
      `).join("")}
      ${employees.map((emp) => `
        <div class="emp-name-cell">${emp.name.split(" ")[0]}</div>
        ${dates.map((d) => {
          const dateStr = isoDate(d);
          const shift = shifts.find((s) => s.employee_id === emp.id && s.date === dateStr);
          return `
            <div class="shift-cell">
              ${shift
                ? `<div class="shift-chip role-${shift.role || "server"}" data-action="editShift" data-id="${shift.id}">
                     <div class="st">${fmtTime(shift.start_time)}–${fmtTime(shift.end_time)}</div>
                     <div class="rl">${ROLES[shift.role || "server"][lang]}</div>
                   </div>`
                : `<button class="empty-cell" data-action="newShift" data-emp="${emp.id}" data-date="${dateStr}">+</button>`
              }
            </div>
          `;
        }).join("")}
      `).join("")}
    </div>
  `;
}

  document.getElementById("shiftModalTitle").textContent = existing ? t("modifierQuart") : t("ajouterQuart");

  const payload = {
    employee_id: employeeId,
    date: document.getElementById("shiftDateInput").value,
    start_time: document.getElementById("shiftStartInput").value,
    end_time: document.getElementById("shiftEndInput").value,
    role: document.getElementById("shiftRoleInput").value,
    note: document.getElementById("shiftNoteInput").value,
  };
  if (!payload.date || !payload.start_time || !payload.end_time) return;
  const btn = document.getElementById("shiftSaveBtn");
  btn.disabled = true;
  try {
    if (shiftId) {
      await api(`/api/admin/shifts/${shiftId}`, { method: "POST", body: JSON.stringify(payload) });
    } else {
      await api("/api/admin/shifts", { method: "POST", body: JSON.stringify(payload) });
    }
    const res = await api("/api/admin/shifts");
    shifts = res.shifts;
    closeShiftModal();
    render();
  } catch (err) {
    alert(t("erreurAjoutQuart"));
  } finally {
    btn.disabled = false;
  }
}

  try {

    const params = new URLSearchParams();

    if (end) params.set("endDate", end);
    overview = await api(`/api/admin/overview?${params.toString()}`);
    try {
      const res = await api("/api/admin/messages");

function fmtDateShort(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString(t("locale"), { weekday: "short", day: "numeric", month: "short" });
}

function fmtDateLong(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString(t("locale"), { day: "numeric", month: "long", year: "numeric" });
}

// Convertit un timestamp SQLite (stocké en UTC, ex: '2026-08-04 23:42:00') en date locale
// 'YYYY-MM-DD' selon le fuseau horaire de l'appareil qui consulte — sinon toute déclaration
// faite en soirée au Québec (UTC-4/-5) semble "en retard" à tort, puisqu'on serait déjà
// rendu au lendemain en UTC.
function utcToLocalDateStr(sqliteDatetime) {
  const d = new Date(sqliteDatetime.replace(" ", "T") + "Z");
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

// Compare la date de création figée (jamais touchée par une modification) à la date déclarée,
// pour savoir combien de jours de retard il y a eu à la déclarer.
function computeDelayDays(entry) {
  if (!entry.created_at || !entry.date) return 0;
  const createdLocalDate = utcToLocalDateStr(entry.created_at);
  const d1 = new Date(createdLocalDate + "T00:00:00Z");
  const d2 = new Date(entry.date + "T00:00:00Z");
  const diffDays = Math.round((d1 - d2) / (1000 * 60 * 60 * 24));
  return diffDays > 0 ? diffDays : 0;
}

// "Modifiée après coup" = les DONNÉES DÉCLARÉES (pas une action admin comme confirmer un
// virement) ont été sauvegardées un AUTRE jour que la création — pas juste le fait de
// remplir les champs un par un à la création (plusieurs sauvegardes de suite le même jour).
function wasModified(entry) {
  if (!entry.created_at || !entry.data_updated_at) return false;
  return utcToLocalDateStr(entry.created_at) !== utcToLocalDateStr(entry.data_updated_at);
}

function fmtModifiedDate(iso) {
  if (!iso) return "";
  const d = new Date(iso.replace(" ", "T") + "Z");
  return d.toLocaleDateString(t("locale"), { day: "numeric", month: "short" });
}

    });
  });

  document.querySelectorAll('[data-action="dismissFlag"]').forEach((btn) => {
    btn.addEventListener("click", async () => {
      const entryId = btn.dataset.entry;
      const flagType = btn.dataset.type;
      const wrap = btn.closest(".pending-chip-wrap");
      btn.disabled = true;
      try {
        await api(`/api/admin/entries/${entryId}/dismiss-flag`, { method: "POST", body: JSON.stringify({ type: flagType }) });
        // met à jour la copie locale pour que le compteur/bandeau restent justes sans tout recharger
        overview.restaurants.forEach((r) => r.employees.forEach((e) => e.entries.forEach((d) => {
          if (d.id === entryId) {
            if (flagType === "late") d.delay_dismissed = 1;
            if (flagType === "modified") d.modified_dismissed = 1;
          }
        })));
        if (wrap) wrap.remove();
        // si c'était la dernière puce du bandeau, on relance un render() pour le faire disparaître au complet
        if (!document.querySelector(".pending-chip-wrap")) render();
      } catch (err) {
        btn.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-action="markTransferred"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      openTransferModal(btn.dataset.entry, btn.dataset.direction);
    });
  });

  document.querySelectorAll('[data-action="delEmployee"]').forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm(t("confirmRetirerEmploye"))) return;
      await api(`/api/admin/employees/${btn.dataset.id}`, { method: "DELETE" });
      await load();
    });
  });

  document.querySelectorAll('[data-action="messageEmployee"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      openThreadModal(btn.dataset.id, btn.dataset.name, btn.dataset.resto);
    });
  });

  document.querySelectorAll('[data-action="copyLink"]').forEach((btn) => {
    btn.addEventListener("click", async () => {
      const link = btn.dataset.link;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(link);
        } else {
          const ta = document.createElement("textarea");
          ta.value = link;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        const original = btn.textContent;
        btn.textContent = t("copie");
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove("copied");
        }, 1500);
      } catch (e) {
        alert(t("copieImpossible") + link);
      }
    });
  });

  document.querySelectorAll('[data-action="delRestaurant"]').forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm(t("confirmSupprimerRestaurant"))) return;
      await api(`/api/admin/restaurants/${btn.dataset.id}`, { method: "DELETE" });
      await load();
    });
  });
}

function fmtMsgDate(iso) {
  if (!iso) return "";
  // iso vient de SQLite au format 'YYYY-MM-DD HH:MM:SS' (UTC) — on le rend lisible.
  const d = new Date(iso.replace(" ", "T") + "Z");
  return d.toLocaleString(t("locale"), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

function groupMessagesByEmployee() {
  const byEmployee = {};
  messages.forEach((m) => {
    if (!byEmployee[m.employee_id]) {
      byEmployee[m.employee_id] = {
        employeeId: m.employee_id,
        employeeName: m.employee_name,
        restaurantName: m.restaurant_name,
        messages: [],
      };
    }
    byEmployee[m.employee_id].messages.push(m);
  });
  const threads = Object.values(byEmployee);
  // chaque messages[] vient déjà trié DESC (le plus récent en premier) depuis le serveur
  threads.forEach((t) => {
    t.lastMessage = t.messages[0];
    t.unreadCount = t.messages.filter((m) => m.sender === "employee" && !m.is_read).length;
  });
  threads.sort((a, b) => new Date(b.lastMessage.created_at) - new Date(a.lastMessage.created_at));
  return threads;
}

function renderMessagesInbox() {
  const container = document.getElementById("messagesInbox");
  if (!container) return;
  const threads = groupMessagesByEmployee();
  const totalUnread = threads.reduce((s, t) => s + t.unreadCount, 0);

  container.innerHTML = `
    <button class="messages-toggle" id="messagesToggleBtn">
      <span class="icn-circle">${icon("inbox", 18)}</span>
      <span>${t("messagesTitle")} ${totalUnread > 0 ? `<span class="unread-badge">${totalUnread}</span>` : ""}</span>
    </button>
    <div id="messagesList" style="display:none; margin-top:12px;">
      ${threads.length === 0 ? `<p style="font-size:12px; color:#8993A4;">${t("aucunMessage")}</p>` : threads.map((th) => `
        <button class="thread-row" data-action="openThread" data-emp="${th.employeeId}">
          <div class="thread-row-top">
            <span class="thread-name">${th.employeeName} <span class="thread-resto">· ${th.restaurantName}</span></span>
            ${th.unreadCount > 0 ? `<span class="unread-badge">${th.unreadCount}</span>` : ""}
          </div>
          <div class="thread-preview">${th.lastMessage.sender === "admin" ? t("toiVers") + " " : ""}${th.lastMessage.body.replace(/</g, "&lt;")}</div>
          <div class="thread-date">${fmtMsgDate(th.lastMessage.created_at)}</div>
        </button>
      `).join("")}
    </div>
  `;

  document.getElementById("messagesToggleBtn").addEventListener("click", () => {
    const list = document.getElementById("messagesList");
    list.style.display = list.style.display === "none" ? "block" : "none";
  });

  container.querySelectorAll('[data-action="openThread"]').forEach((btn) => {
    btn.addEventListener("click", () => openThreadModal(btn.dataset.emp));
  });
}

async function openThreadModal(employeeId, employeeName, restaurantName) {
  const overlay = document.getElementById("threadModalOverlay");
  overlay.style.display = "flex";
  overlay.dataset.emp = employeeId;
  document.getElementById("threadReplyBody").value = "";
  document.getElementById("threadReplyBody").placeholder = t("repondrePlaceholder");
  document.getElementById("deleteThreadBtn").textContent = t("supprimerConversation");
  document.getElementById("threadReplySendBtn").textContent = t("messageSend");
  renderThreadMessages(employeeId);

  const threads = groupMessagesByEmployee();
  const thread = threads.find((th) => th.employeeId === employeeId);
  if (thread) {
    document.getElementById("threadModalTitle").textContent = `${thread.employeeName} · ${thread.restaurantName}`;
  } else if (employeeName) {
    // aucune conversation existante encore — on utilise le nom/restaurant fournis directement
    document.getElementById("threadModalTitle").textContent = `${employeeName} · ${restaurantName || ""}`;
  }

  if (thread && thread.unreadCount > 0) {
    try {
      await api(`/api/admin/employees/${employeeId}/messages/mark-read`, { method: "POST", body: "{}" });
      messages.forEach((m) => { if (m.employee_id === employeeId && m.sender === "employee") m.is_read = 1; });
      renderMessagesInbox();
    } catch (e) { /* pas grave si ça échoue */ }
  }
}

function closeThreadModal() {
  document.getElementById("threadModalOverlay").style.display = "none";
}

function renderThreadMessages(employeeId) {
  const wrap = document.getElementById("threadMessages");
  const empMessages = messages.filter((m) => m.employee_id === employeeId).slice().reverse(); // ordre chronologique ASC pour l'affichage
  wrap.innerHTML = empMessages.map((m) => `
    <div class="conv-bubble ${m.sender === "admin" ? "conv-admin" : "conv-employee"}">
      <div class="conv-sender">${m.sender === "admin" ? t("toiLabel") : m.employee_name}</div>
      <div class="conv-body">${m.body.replace(/</g, "&lt;")}</div>
      <button class="conv-delete-btn" data-action="deleteThreadMessage" data-id="${m.id}">${t("supprimerMessage")}</button>
    </div>
  `).join("");
  wrap.scrollTop = wrap.scrollHeight;

  wrap.querySelectorAll('[data-action="deleteThreadMessage"]').forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm(t("confirmSupprimerMessage"))) return;
      await api(`/api/admin/messages/${btn.dataset.id}`, { method: "DELETE" });
      messages = messages.filter((m) => m.id !== btn.dataset.id);
      renderThreadMessages(employeeId);
      renderMessagesInbox();
    });
  });
}

function csvEscape(val) {
  const s = String(val ?? "");
  if (s.includes(",") || s.includes('"') || s.includes("\n")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportCSV() {
  const rows = [t("csvHeaders")];

  overview.restaurants.forEach((r) => {
    const restoTotals = { ventes: 0, clients: 0, remis: 0, brut: 0, net: 0 };

    r.employees.forEach((e) => {
      const empTotals = { ventes: 0, clients: 0, remis: 0, brut: 0, net: 0 };

      e.entries.forEach((d) => {
        const directionLabel =
          d.remit_direction === "employer_owes" ? t("csvEmployerOwes") :
          d.remit_direction === "employee_owes" ? t("csvEmployeeOwes") :
          t("csvNone");
        rows.push([
          r.name,
          e.name,
          e.employee_number || "",
          d.date,
          d.ventes.toFixed(2),
          d.clients,
          d.pct.toFixed(1),
          d.remis.toFixed(2),
          d.pourboireBrut.toFixed(2),
          d.net.toFixed(2),
          d.moyenne.toFixed(2),
          directionLabel,
          d.remit_direction ? (d.remit_amount || 0).toFixed(2) : "",
          d.remit_direction ? (d.transferred ? t("csvOui") : t("csvNon")) : "",
          d.transferred ? (d.transfer_date || "") : "",
        ]);
        empTotals.ventes += d.ventes;
        empTotals.clients += d.clients;
        empTotals.remis += d.remis;
        empTotals.brut += d.pourboireBrut;
        empTotals.net += d.net;
      });

      // Sous-total de l'employé (une seule ligne, après toutes ses journées)
      const empPctMoyen = empTotals.ventes > 0 ? (empTotals.brut / empTotals.ventes) * 100 : 0;
      const empMoyClient = empTotals.clients > 0 ? empTotals.net / empTotals.clients : 0;
      rows.push([
        "", t("csvSousTotal") + " " + e.name, "", "",
        empTotals.ventes.toFixed(2),
        empTotals.clients,
        empPctMoyen.toFixed(1),
        empTotals.remis.toFixed(2),
        empTotals.brut.toFixed(2),
        empTotals.net.toFixed(2),
        empMoyClient.toFixed(2),
        "", "", "", "",
      ]);

      restoTotals.ventes += empTotals.ventes;
      restoTotals.clients += empTotals.clients;
      restoTotals.remis += empTotals.remis;
      restoTotals.brut += empTotals.brut;
      restoTotals.net += empTotals.net;
    });

    // Total du restaurant au complet (tous les employés additionnés)
    const restoPctMoyen = restoTotals.ventes > 0 ? (restoTotals.brut / restoTotals.ventes) * 100 : 0;
    const restoMoyClient = restoTotals.clients > 0 ? restoTotals.net / restoTotals.clients : 0;
    rows.push([
      r.name, t("csvTotalRestaurant"), "", "",
      restoTotals.ventes.toFixed(2),
      restoTotals.clients,
      restoPctMoyen.toFixed(1),
      restoTotals.remis.toFixed(2),
      restoTotals.brut.toFixed(2),
      restoTotals.net.toFixed(2),
      restoMoyClient.toFixed(2),
      "", "", "", "",
    ]);
    rows.push([]); // ligne vide pour bien séparer visuellement chaque restaurant
  });

  const csvContent = rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const { start, end } = resolvePeriod();
  const suffix = period.mode === "all" ? t("tout") : `${start}_${lang === "fr" ? "au" : "to"}_${end}`;
  const a = document.createElement("a");
  a.href = url;
  a.download = `coco-frutti-pourboires-${suffix}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function openTransferModal(entryId, direction) {
  const overlay = document.getElementById("modalOverlay");
  const dateInput = document.getElementById("modalDate");
  document.getElementById("modalTitle").textContent =
    direction === "employer_owes" ? t("confirmTransferTitle") : t("confirmReceptionTitle");
  document.getElementById("modalMsg").textContent =
    direction === "employer_owes" ? t("confirmTransferMsg") : t("confirmTransferMsgReceived");
  dateInput.value = todayISO();
  document.getElementById("modalCancel").textContent = t("annulerBtn");
  document.getElementById("modalConfirm").textContent = t("confirmerBtn");
  overlay.style.display = "flex";

  const cancelBtn = document.getElementById("modalCancel");
  const confirmBtn = document.getElementById("modalConfirm");

  const close = () => { overlay.style.display = "none"; };
  const onCancel = () => { close(); cleanup(); };
  const onConfirm = async () => {
    await api(`/api/admin/entries/${entryId}/transferred`, {
      method: "POST",
      body: JSON.stringify({ transferred: true, transfer_date: dateInput.value }),
    });
    close();
    cleanup();
    await load();
  };
  function cleanup() {
    cancelBtn.removeEventListener("click", onCancel);
    confirmBtn.removeEventListener("click", onConfirm);
  }
  cancelBtn.addEventListener("click", onCancel);
  confirmBtn.addEventListener("click", onConfirm);
}

function setupThreadModal() {
  const overlay = document.getElementById("threadModalOverlay");
  document.getElementById("threadModalCloseX").addEventListener("click", closeThreadModal);
  overlay.addEventListener("click", (ev) => {
    if (ev.target === overlay) closeThreadModal();
  });
  document.getElementById("deleteThreadBtn").addEventListener("click", async () => {
    const employeeId = overlay.dataset.emp;
    if (!employeeId) return;
    const hasMessages = messages.some((m) => m.employee_id === employeeId);
    if (!hasMessages) { closeThreadModal(); return; }
    if (!confirm(t("confirmSupprimerConversation"))) return;
    try {
      await api(`/api/admin/employees/${employeeId}/messages`, { method: "DELETE" });
      messages = messages.filter((m) => m.employee_id !== employeeId);
      closeThreadModal();
      renderMessagesInbox();
    } catch (err) {
      alert(t("erreurEnvoiReponse"));
    }
  });
  document.getElementById("threadReplySendBtn").addEventListener("click", async () => {
    const employeeId = overlay.dataset.emp;
    const textarea = document.getElementById("threadReplyBody");
    const body = textarea.value.trim();
    if (!body || !employeeId) return;
    const btn = document.getElementById("threadReplySendBtn");
    const originalText = btn.textContent;
    btn.textContent = "…";
    btn.disabled = true;
    try {
      await api(`/api/admin/employees/${employeeId}/messages`, { method: "POST", body: JSON.stringify({ body }) });
      const res = await api("/api/admin/messages");
      messages = res.messages;
      textarea.value = "";
      renderThreadMessages(employeeId);
      renderMessagesInbox();
    } catch (err) {
      alert(t("erreurEnvoiReponse"));
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });
}
setupThreadModal();

function setupShiftModal() {
  const overlay = document.getElementById("shiftModalOverlay");
  document.getElementById("shiftModalCloseX").addEventListener("click", closeShiftModal);
  overlay.addEventListener("click", (ev) => {
    if (ev.target === overlay) closeShiftModal();
  });
  document.getElementById("shiftSaveBtn").addEventListener("click", saveShiftFromModal);
  document.getElementById("shiftDeleteBtn").addEventListener("click", deleteShiftFromModal);
}
setupShiftModal();
