<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Suivi des pourboires / Tip Tracking</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Déclara" />
<meta name="theme-color" content="#10151D" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background-color: #10151D;
    color: #F1EFEA; padding-bottom: 60px; -webkit-font-smoothing: antialiased; }
  .header {
    background: linear-gradient(160deg,#161C26 0%,#10151D 100%); padding: 30px 22px 32px; color: white;
    display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -140px; right: -60px; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,168,87,0.16), transparent 70%); pointer-events: none;
  }
  .title { font-family: 'Fraunces', serif; font-size: 25px; font-weight: 600; margin: 0; display:flex; align-items:center; letter-spacing: -0.01em; position: relative; }
  .title-mark {
    width: 34px; height: 34px; border-radius: 9px; background: #6FBF93; color: #10151D;
    display: inline-flex; align-items: center; justify-content: center; margin-right: 10px; flex-shrink: 0;
    font-style: italic; font-size: 18px; box-shadow: 0 4px 12px -3px rgba(111,191,147,0.5);
  }
  .lang-toggle { background: rgba(255,255,255,0.08); color: white; font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; position: relative; }
  .content { padding: 20px 16px; max-width: 900px; margin: 0 auto; }
  .card { background: #161C26; border-radius: 18px; padding: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 18px; }
  .login-screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #161C26 0%, #10151D 100%); padding: 24px; position: relative; overflow: hidden;
  }
  .login-screen::before {
    content: ''; position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
    width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,168,87,0.16), transparent 68%);
    pointer-events: none;
  }
  .login-screen::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .login-glow {
    position: absolute; border-radius: 50%; filter: blur(50px); pointer-events: none;
  }
  .login-glow.g1 { width: 260px; height: 260px; background: rgba(111,191,147,0.28); top: 6%; left: -10%; }
  .login-glow.g2 { width: 260px; height: 260px; background: rgba(212,168,87,0.25); bottom: 6%; right: -10%; }
  .login-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; animation: loginFadeUp .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes loginFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .login-brand-mark {
    width: 38px; height: 38px; border-radius: 10px; background: #6FBF93;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 6px 16px -4px rgba(111,191,147,0.5);
    font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; font-size: 21px; color: #10151D;
  }
  .login-brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 27px; color: white; letter-spacing: -0.01em; }
  .login-box {
    max-width: 360px; width: 100%; text-align: center; background: #161C26; border-radius: 18px;
    padding: 38px 30px 32px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
  }
  .login-box::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 7px;
    background: linear-gradient(90deg, #6FBF93 0%, #D4A857 55%, #E2685A 100%);
  }
  .login-tagline {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
    font-size: 16px; color: #A8C4B4; margin: 0 0 30px; text-align: center; max-width: 300px;
  }
  .login-box h2 {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #D4A857;
    margin: 0 0 22px; text-transform: uppercase; letter-spacing: 0.08em;
    background: rgba(212,168,87,0.12); padding: 6px 14px; border-radius: 999px;
  }
  .login-field-wrap { position: relative; margin-bottom: 14px; }
  .login-field-wrap svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: #D4A857; pointer-events: none;
  }
  .login-box input[type=password] {
    width: 100%; padding: 13px 14px 13px 38px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.1);
    font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; background: #10151D; color: #F1EFEA;
  }
  .login-box input[type=password]:focus { border-color: #D4A857; box-shadow: 0 0 0 3px rgba(212,168,87,0.15); }
  .login-box button#loginBtn {
    width: 100%; background: #D4A857; color: #10151D; border: none; border-radius: 10px;
    padding: 13px; font-size: 14.5px; font-weight: 700; cursor: pointer; transition: background .15s, transform .15s, box-shadow .15s;
  }
  .login-box button#loginBtn:hover { background: #E5C078; transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(212,168,87,0.5); }
  .login-back {
    margin-top: 24px; font-size: 12.5px; color: rgba(255,255,255,0.5); text-decoration: none; transition: color .15s;
  }
  .login-back:hover { color: #A8C4B4; }
  .login-lang-toggle {
    position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.12); color: white;
    font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: none; cursor: pointer; z-index: 2;
  }
  input, button, select { font-family: inherit; }
  input[type=password], input[type=text] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: #10151D; color: #F1EFEA; font-size: 14px; margin-bottom: 10px; }
  button { background: #6FBF93; color: #10151D; border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button.secondary { background: rgba(255,255,255,0.08); color: #F1EFEA; }
  button.danger { background: #E2685A; color: #10151D; }
  .restaurant-title {
    font-family: 'Fraunces', serif; font-size: 23px; font-weight: 600; color: #F1EFEA; margin: 0 0 4px;
    display:flex; justify-content:space-between; align-items:center; letter-spacing: -0.01em;
  }
  .restaurant-total { font-size: 12.5px; color: #8993A4; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .employee-card-block {
    background: #1B222D; border-radius: 14px; padding: 16px 16px 14px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.06);
  }
  .employee-card-block:last-of-type { margin-bottom: 0; }
  .employee-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 0 0 10px; }
  /* Le bloc de gauche prend la place qui reste, mais accepte de rétrécir : sans min-width:0
     une adresse longue refuse de se replier et pousse les boutons hors de la carte. */
  .employee-row > div:first-child { flex: 1 1 240px; min-width: 0; }
  .employee-card-block:first-of-type .employee-row { border-top: none; }
  /* Les boutons étaient empilés en COLONNE, quelle que soit la largeur. Sur un téléphone
     ça se défendait ; sur une tablette, quatre boutons l'un sous l'autre rendaient la
     rangée plus haute que le texte à sa gauche, et la carte se retrouvait à moitié vide.
     En ligne avec retour automatique : une seule ligne sur grand écran, deux sur un
     téléphone, et plus jamais de colonne de la hauteur de la carte. */
  .employee-row-actions {
    display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px;
    align-items: center; justify-content: flex-end; margin-left: auto;
  }
  .secondary-btn { background: rgba(255,255,255,0.08); color: #F1EFEA; font-size: 10px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; height: fit-content; }
  .employee-stats { display: flex; gap: 22px; flex-wrap: wrap; padding: 4px 0 12px; align-items: flex-end; }
  .employee-stat-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #8993A4; font-weight: 700; margin-bottom: 3px; }
  .employee-stat-value { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: #F1EFEA; }
  .employee-name { font-weight: 700; font-size: 15px; color: #F1EFEA; }
  .employee-sub { font-size: 11px; color: #8993A4; }
  .link-box { font-size: 11px; background: rgba(255,255,255,0.06); color: #8993A4; padding: 4px 8px; border-radius: 6px; font-family: monospace; word-break: break-all; }
  .link-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .link-row .link-box { flex: 1; margin-top: 0; }
  .copy-btn { background: #6FBF93; color: #10151D; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
  .copy-btn.copied { background: #D4A857; }
  .report-toggle {
    background: rgba(255,255,255,0.08); color: #F1EFEA; font-size: 11px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; margin-top: 8px;
  }
  .report-table-wrap { margin-top: 10px; overflow-x: auto; }
  .report-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .report-table th {
    text-align: left; font-size: 9px; text-transform: uppercase; color: #8993A4;
    padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap;
  }
  .report-table td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; color: #D8D5CE; }
  .report-table tr:last-child td { border-bottom: none; }
  /* La vignette ouvre une fenêtre DANS la page. Avant, c'était un lien target="_blank" vers
     l'image brute : sur un téléphone, et surtout quand l'app est ajoutée à l'écran d'accueil
     (apple-mobile-web-app-title), ça s'ouvre sans barre de navigateur — donc sans bouton
     fermer ni flèche retour. Rapporté ainsi : « quand j'ouvre une photo pour valider dans mon
     admin il n'y a pas de bouton fermer sur mon cell ». */
  .photo-ouvre { background: none; border: 0; padding: 0; line-height: 0; cursor: pointer; }
  #photoOverlay {
    position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px;
  }
  #photoOverlay .photo-jour { font-size: 12px; color: #8993A4; font-weight: 700; }
  #photoOverlay img {
    max-width: 100%; max-height: 72vh; object-fit: contain;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
  }
  /* Pleine largeur et 48 px de haut, comme le bouton de l'alerte des fêtes : on le cherche
     d'une main, sur un téléphone, sans viser. */
  #photoOverlay .photo-fermer {
    width: 100%; max-width: 420px; height: 48px; border: 0; border-radius: 12px;
    background: #6FBF93; color: #10151D; font-weight: 800; font-size: 15px;
    letter-spacing: 0.04em; cursor: pointer;
  }
  .report-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); vertical-align: middle; }
  .sent-badge {
    display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
    white-space: nowrap; margin-top: 3px;
  }
  .sent-badge.sent { background: rgba(111,191,147,0.15); color: #6FBF93; }
  .sent-badge.unsent { background: rgba(255,255,255,0.06); color: #8993A4; }
  .delay-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
  .delay-badge.delay-ok { background: rgba(111,191,147,0.15); color: #6FBF93; }
  .delay-badge.delay-warn { background: rgba(212,168,87,0.15); color: #D4A857; }
  .delay-badge.delay-bad { background: rgba(226,104,90,0.15); color: #E2685A; }
  .modified-badge { font-size: 9px; color: #D4A857; margin-top: 2px; white-space: nowrap; }
  tr.row-jump-highlight { animation: rowJumpFlash 1.6s ease; }
  @keyframes rowJumpFlash { 0% { background: rgba(212,168,87,0.18); } 100% { background: transparent; } }
  .row-flagged-owed-employee { background: rgba(226,104,90,0.08); }
  .row-flagged-owed-employer { background: rgba(212,168,87,0.08); }
  .transfer-btn { background: #E2685A; color: #10151D; font-size: 10px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; font-weight: 700; }
  .transfer-btn.owed-employer { background: #D4A857; }
  /* La poubelle d'une journée reste grise au repos et ne devient rouge qu'au survol : dans un
     tableau où chaque rangée en porte une, une colonne de rouge se lirait comme une alerte. */
  /* Le crayon vit à côté de la poubelle, gris au repos comme elle : dans un tableau où
     chaque rangée porte deux boutons, une colonne de couleur se lirait comme une alerte. */
  .day-edit-btn {
    background: none; border: 0; color: #8993A4; cursor: pointer;
    padding: 4px 5px; border-radius: 6px; line-height: 0; margin-right: 2px;
  }
  .day-edit-btn:hover { color: #6FBF93; background: rgba(111,191,147,0.12); }
  .entry-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .entry-grille label { font-size: 11px; color: #8993A4; }
  .entry-grille input {
    width: 100%; margin-top: 4px; padding: 9px 10px; font-size: 14px;
    background: #10151D; color: #F1EFEA; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
  }
  #entryMontant {
    padding: 9px 10px; font-size: 14px; background: #10151D; color: #F1EFEA;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
  }
  .entry-net {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(111,191,147,0.1); border-radius: 10px; padding: 10px 12px; margin-top: 12px;
  }
  .entry-net span { font-size: 11px; color: #8993A4; font-weight: 700; letter-spacing: 0.04em; }
  .entry-net b { font-family: Fraunces, serif; font-size: 17px; font-weight: 800; color: #6FBF93; }
  .entry-net.negatif b { color: #E2685A; }
  .entry-avant { font-size: 10.5px; color: #8993A4; margin-top: 5px; }
  .entry-avis {
    background: rgba(226,104,90,0.12); border: 1px solid rgba(226,104,90,0.35);
    border-radius: 10px; padding: 9px 11px; margin-bottom: 14px;
  }
  .entry-avis b { display: block; font-size: 11.5px; color: #E2685A; line-height: 1.35; }
  .entry-avis span { display: block; font-size: 11px; color: #8993A4; margin-top: 3px; line-height: 1.35; }
  .entry-sens { display: flex; gap: 6px; margin-bottom: 8px; }
  .entry-sens button {
    flex: 1; height: 34px; font-size: 11.5px; border: 0; border-radius: 8px;
    background: rgba(255,255,255,0.07); color: #8993A4; cursor: pointer;
  }
  .entry-sens button.actif { background: #6FBF93; color: #10151D; font-weight: 700; }
  .entry-hotesse { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; color: #F1EFEA; }
  .entry-hotesse input { width: 17px; height: 17px; accent-color: #6FBF93; }
  .day-del-btn {
    background: none; color: #8993A4; padding: 4px 6px; border-radius: 6px; line-height: 0;
  }
  .day-del-btn:hover { color: #E2685A; background: rgba(226,104,90,0.12); }
  .transfer-done {
    display: inline-block; background: #39E639; color: #10151D; font-weight: 700; font-size: 11px;
    white-space: nowrap; padding: 4px 10px; border-radius: 999px;
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-box { background: #161C26; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; max-width: 340px; width: 100%; color: #F1EFEA; }
  .modal-box h3 { margin: 0 0 10px; font-size: 16px; color: #F1EFEA; }
  .modal-header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-header-row h3 { margin: 0; }
  .modal-close-x { background: none; border: none; font-size: 18px; color: #8993A4; padding: 0 0 0 10px; line-height: 1; cursor: pointer; }
  .modal-box p { font-size: 13px; color: #8993A4; margin: 0 0 14px; }
  .modal-box input[type=date] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: #10151D; color: #F1EFEA; font-size: 14px; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; }
  .modal-actions button.danger-text { background: rgba(226,104,90,0.15); color: #E2685A; }
  .pending-banner {
    background: rgba(226,104,90,0.1); border: 1px solid rgba(226,104,90,0.25); color: #E2685A; border-radius: 14px;
    padding: 12px 14px; font-size: 13px; font-weight: 700; margin-bottom: 14px;
  }
  .pending-banner.banner-delay {
    background: rgba(212,168,87,0.1); border: 1px solid rgba(212,168,87,0.25); color: #D4A857;
  }
  .messages-toggle {
    background: none; border: none; padding: 0; color: #F1EFEA; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  }
  .messages-toggle .icn-circle {
    width: 38px; height: 38px; border-radius: 10px; background: rgba(111,191,147,0.15);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #6FBF93;
  }
  .unread-badge {
    background: #E2685A; color: #10151D; font-size: 11px; font-weight: 800; border-radius: 999px;
    padding: 2px 8px; min-width: 18px; text-align: center; display: inline-block;
  }
  .thread-row {
    display: block; width: 100%; text-align: left; background: none; border: none;
    border-top: 1px solid rgba(255,255,255,0.07); padding: 10px 0;
  }
  .thread-row:first-child { border-top: none; }
  .thread-row-top { display: flex; justify-content: space-between; align-items: center; }
  .thread-name { font-size: 13px; font-weight: 700; color: #F1EFEA; }
  .thread-resto { font-size: 11px; font-weight: 400; color: #8993A4; }
  .thread-preview { font-size: 12px; color: #8993A4; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-date { font-size: 10px; color: #6B7280; margin-top: 2px; }
  .thread-modal-box { max-width: 400px; }
  .conversation-history { max-height: 280px; overflow-y: auto; margin-bottom: 12px; padding-right: 2px; }
  .conv-bubble { max-width: 88%; margin-bottom: 8px; padding: 8px 10px; border-radius: 12px; position: relative; }
  .conv-bubble.conv-employee { background: rgba(255,255,255,0.06); margin-right: auto; border-bottom-left-radius: 4px; }
  .conv-bubble.conv-admin { background: rgba(212,168,87,0.15); margin-left: auto; border-bottom-right-radius: 4px; }
  .conv-sender { font-size: 9px; font-weight: 700; text-transform: uppercase; color: #8993A4; margin-bottom: 2px; }
  .conv-body { font-size: 13px; color: #F1EFEA; white-space: pre-wrap; }
  .conv-delete-btn {
    background: none; border: none; color: #6B7280; font-size: 10px; padding: 4px 0 0;
    text-decoration: underline; cursor: pointer;
  }
  .reply-textarea {
    width: 100%; min-height: 60px; border: none; border-radius: 8px; padding: 8px;
    font-size: 13px; font-family: inherit; background: rgba(255,255,255,0.06); color: #F1EFEA; outline: none; resize: vertical; margin-bottom: 6px;
  }
  .pending-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pending-chip {
    background: rgba(255,255,255,0.06); font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; color: #F1EFEA;
  }
  .pending-chip.chip-owed-employee { color: #E2685A; }
  .pending-chip.chip-owed-employer { color: #D4A857; }
  .pending-chip-wrap { display: inline-flex; align-items: stretch; border-radius: 999px; overflow: hidden; }
  .pending-chip-wrap .pending-chip { border-radius: 999px 0 0 999px; border-right: none; }
  .chip-dismiss-x {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-left: 1px solid rgba(255,255,255,0.1);
    color: #8993A4; font-size: 11px; padding: 6px 9px; border-radius: 0 999px 999px 0;
  }
  .employee-card-block.jump-highlight { animation: jumpFlash 1.6s ease; }
  @keyframes jumpFlash { 0% { background: rgba(212,168,87,0.18); } 100% { background: #1B222D; } }
  .totals { font-size: 12px; text-align: right; color: #8993A4; }
  .totals b { color: #F1EFEA; }
  .add-form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add-form input { flex: 1; min-width: 120px; margin-bottom: 0; }
  /* La barre d'onglets. Collée en haut : sur un téléphone la grille d'horaire fait plusieurs
     écrans de haut, et une barre qui défile avec la page obligerait à remonter tout en haut
     juste pour changer de section — exactement ce qu'on cherche à supprimer. */
  .onglets {
    position: sticky; top: 0; z-index: 30; display: flex; gap: 6px;
    padding: 8px 0 10px; margin-bottom: 4px;
    background: #10151D; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .onglet {
    flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 9px 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.03); color: #8993A4;
    font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
    position: relative; line-height: 1.2; text-align: center;
  }
  .onglet.actif { background: rgba(111,191,147,0.14); border-color: rgba(111,191,147,0.45); color: #6FBF93; }
  /* Le nom ne revient jamais à la ligne : trois onglets de hauteurs différentes feraient
     sauter la barre en changeant de section. */
  .onglet .onglet-nom { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  /* La pastille dit combien de journées attendent, même quand on est dans un horaire : sinon
     passer la semaine dans l'onglet cuisine ferait manquer les virements dus. */
  .onglet-pastille {
    position: absolute; top: 3px; right: 6px; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 999px; background: #E2685A; color: #10151D;
    font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #8993A4; margin: 20px 0 8px; }
  .period-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .period-btn {
    background: rgba(255,255,255,0.07); color: #F1EFEA; font-size: 12px; height: 34px; padding: 0 14px;
    border-radius: 999px; display: inline-flex; align-items: center; white-space: nowrap;
  }
  .period-btn.active { background: #6FBF93; color: #10151D; }
  .period-dates {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #8993A4;
    border: 1px solid transparent; border-radius: 14px;
  }
  .period-dates.active { border-color: rgba(111,191,147,0.45); background: rgba(111,191,147,0.08); padding: 5px 8px; }
  .period-dates input {
    height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.1); background: #10151D; font-size: 12px;
    margin-bottom: 0; color: #F1EFEA; min-width: 0;
  }
  .period-dates input:focus { outline: none; border-color: #6FBF93; box-shadow: 0 0 0 3px rgba(111,191,147,0.15); }
  .period-apply {
    height: 34px; padding: 0 14px; font-size: 12px; border-radius: 9px; white-space: nowrap;
    background: transparent; border: 1px solid rgba(111,191,147,0.5); color: #6FBF93;
  }
  .period-apply:disabled { border-color: rgba(255,255,255,0.1); color: #5B6577; cursor: not-allowed; }
  .period-clear {
    height: 34px; width: 34px; padding: 0; border-radius: 999px; font-size: 13px; line-height: 1;
    background: rgba(255,255,255,0.07); color: #8993A4; flex-shrink: 0;
  }
  .period-error { font-size: 12px; color: #E2685A; margin: -8px 0 12px; }
  .period-bar.is-busy { opacity: 0.5; pointer-events: none; }
  @media (max-width: 560px) {
    .period-bar > .period-dates { flex: 1 1 100%; }
    .period-dates input { flex: 1 1 40%; }
    .period-apply { flex: 1 1 120px; }
  }
  .period-label { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; color: #F1EFEA; margin-top: 6px; margin-bottom: 6px; letter-spacing: -0.01em; }
  /* Les deux rapports côte à côte, de largeur égale : ils se choisissent l'un OU l'autre,
     et un bouton posé sous l'autre se lit comme une suite d'étapes. Les noms se suffisent —
     « Résumé pour paye » dit à quoi ça sert, « Rapport total » dit ce que ça contient. */
  .export-row { display: flex; gap: 8px; margin-top: 12px; }
  .export-row > button {
    flex: 1 1 0; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12.5px; font-weight: 800; padding: 13px 6px; border-radius: 10px; min-height: 48px;
    white-space: nowrap;
  }
  .export-btn {
    background: #D4A857; color: #10151D; box-shadow: 0 2px 8px rgba(212,168,87,0.25);
  }
  .backup-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 10px;
    background: rgba(111,191,147,0.14); border: 1px solid rgba(111,191,147,0.32); color: #6FBF93;
    font-size: 13.5px; font-weight: 700; padding: 13px; border-radius: 10px;
  }
  .backup-btn:disabled { opacity: 0.55; }
  .backup-hint { font-size: 11.5px; color: #8993A4; margin-top: 8px; line-height: 1.5; text-align: center; }
  .backup-hint strong { color: #A8C4B4; font-weight: 600; }
  .sparkline-wrap { margin-top: 4px; }
  .sparkline-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #8993A4; font-weight: 700; margin-bottom: 6px; }
  .sparkline-bar { fill: #6FBF93; }
  .sparkline-bar.negative { fill: #E2685A; }

  /* ---------- Horaire : grille hebdomadaire ---------- */
  .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .week-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; color: #F1EFEA; }
  .week-nav { display: flex; gap: 6px; }
  .week-nav button {
    background: rgba(255,255,255,0.08); border: none; color: #F1EFEA; padding: 6px 10px;
    border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .week-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .duplicate-week-btn {
    background: rgba(212,168,87,0.14); border: 1px solid rgba(212,168,87,0.3); color: #D4A857;
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .pdf-week-btn {
    background: rgba(111,191,147,0.14); border: 1px solid rgba(111,191,147,0.32); color: #6FBF93;
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .photo-week-btn {
    background: rgba(111,191,147,0.14); border: 1px solid rgba(111,191,147,0.32); color: #6FBF93;
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  /* Rouge et en dernier : on ne l'atteint pas par accident en visant un export. */
  .clear-week-btn {
    background: rgba(226,104,90,0.12); border: 1px solid rgba(226,104,90,0.3); color: #E2685A;
    font-size: 11.5px; font-weight: 700; padding: 7px 12px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .pdf-week-btn:disabled, .duplicate-week-btn:disabled, .clear-week-btn:disabled, .photo-week-btn:disabled { opacity: 0.55; }
  /* « Effacer la semaine » a sa propre zone, séparée des exports. Avant, il était collé à
     « Photo de la semaine » dans une rangée de boutons de 29 px de haut : sur un téléphone,
     une tape à côté séparait publier son horaire de le détruire. Et il grossit : c'est une
     action rare, pas une action serrée. */
  /* Le rappel de sauvegarde. Volontairement sobre : il n'est ni une alerte d'argent ni un
     retard, et il ne doit pas se battre avec les bandeaux rouges. Mais le bouton, lui, est
     plein et atteignable du pouce. */
  /* Le bouton qui range tout le bandeau. Sobre et en dernier : il ne doit pas se lire comme
     l'action principale du bandeau, qui reste « aller voir la personne ». */
  .tout-de-cote {
    margin-top: 10px; background: rgba(255,255,255,0.07); color: #8993A4;
    font-size: 11.5px; font-weight: 700; padding: 10px 14px; border-radius: 999px;
    min-height: 40px; border: none;
  }
  /* Deux boutons de téléchargement, de même taille et de même forme : ce sont deux rapports,
     pas une action et son option. Le détail reste en second et en sourdine — on le sort quand
     quelqu'un conteste un chiffre, pas chaque semaine — mais il se tape aussi facilement. */
  .export-detail-btn {
    background: rgba(212,168,87,0.14); color: #D4A857; border: 1px solid rgba(212,168,87,0.35);
  }
  .export-aide { font-size: 11px; color: #8993A4; margin: 7px 0 0; line-height: 1.4; }
  .rappel-sauvegarde {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: rgba(212,168,87,0.10); border: 1px solid rgba(212,168,87,0.28);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
    color: #D4A857; font-size: 12.5px; font-weight: 700; line-height: 1.35;
  }
  .rappel-sauvegarde .backup-btn { min-height: 44px; flex: 0 0 auto; }
  .zone-dangereuse {
    margin: 14px 0 10px; padding-top: 12px; display: flex; justify-content: flex-end;
    border-top: 1px dashed rgba(226,104,90,0.25);
  }
  .zone-dangereuse .clear-week-btn { font-size: 12.5px; padding: 11px 16px; min-height: 44px; }
  /* Le filet d'après l'effacement. Dans <body> et pas dans #app : un rerender() le ferait
     disparaître au moment précis où il sert. Au-dessus de tout, et loin du pouce qui vient
     de taper, pour qu'on ne l'annule pas par le même geste qui vient d'effacer. */
  .barre-annulation {
    position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 9000;
    background: #1D2634; border: 1px solid rgba(226,104,90,0.45); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; color: #F1EFEA; font-size: 13px; font-weight: 600;
  }
  .barre-annulation .annuler-btn {
    background: #E2685A; color: #10151D; font-weight: 800; font-size: 13px;
    padding: 11px 18px; border-radius: 999px; min-height: 44px; white-space: nowrap; flex: 0 0 auto;
  }
  .barre-annulation .annuler-btn:disabled { opacity: 0.6; }

  /* Masse salariale de la semaine affichée. Collée en haut : le chiffre sert pendant qu'on
     bouge un quart, pas après — et sur un téléphone, il sortirait sinon de l'écran dès qu'on
     descend dans la grille. */
  .cout-bar {
    position: sticky; top: 8px; z-index: 40;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
    background: #10151D; border: 1px solid rgba(111,191,147,0.22); border-radius: 14px;
    padding: 10px 14px; margin-bottom: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .cout-bloc { flex: 1 1 88px; min-width: 88px; }
  .cout-etiq { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #8993A4; font-weight: 700; }
  .cout-val { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; color: #F1EFEA; margin-top: 2px; }
  .cout-val.cout-gros { font-size: 20px; color: #D4A857; }
  .cout-val.cout-baisse { color: #6FBF93; }
  .cout-val.cout-hausse { color: #E2685A; }
  .cout-val.cout-egal { color: #8993A4; }
  .cout-notes { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10px; color: #8993A4; margin-bottom: 12px; }
  .cout-notes .cout-manque { color: #D4A857; }
  /* L'entête d'une fiche repliée : le nom à gauche, l'argent à droite, et c'est tout.
     C'est la ligne qu'on parcourt du pouce en cherchant quelqu'un. */
  .fiche-entete {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: none; padding: 12px 0; cursor: pointer;
    font-family: inherit; text-align: left; color: inherit;
  }
  .fiche-fleche { color: #D4A857; font-size: 11px; width: 10px; flex: 0 0 auto; }
  .fiche-nom {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: #F1EFEA;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Les montants ne rétrécissent jamais : c'est l'information qu'on vient chercher, et un
     nom long ne doit pas la pousser hors de l'écran. */
  .fiche-resume { flex: 0 0 auto; display: flex; gap: 10px; font-size: 13px; }
  .fiche-entete.ouverte .fiche-resume { opacity: 0.45; }
  .edition-form {
    margin-top: 10px; padding: 10px; border-radius: 12px;
    background: rgba(212,168,87,0.08); border: 1px solid rgba(212,168,87,0.25);
  }
  .edition-champs { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
  .edition-form input {
    width: 100%; border: none; border-radius: 10px; padding: 9px 10px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    background: rgba(255,255,255,0.08); color: #F1EFEA; outline: none;
  }
  .edition-actions { display: flex; gap: 8px; margin-top: 10px; }
  .plafond-form { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.07); }
  .secteur-select {
    background: rgba(255,255,255,0.06); color: #F1EFEA; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 4px 8px; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  /* La marque qui dit pourquoi la même personne apparaît dans les deux listes. */
  .marque-deux {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    background: rgba(212,168,87,0.18); color: #D4A857; font-size: 10px; font-weight: 800;
    vertical-align: middle;
  }
  /* Section « Employés cuisine », repliée par défaut. */
  .secteur-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 10px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    color: #F1EFEA; font-size: 12px; font-weight: 700; padding: 10px 14px; border-radius: 12px;
  }
  .secteur-toggle.ouvert { background: rgba(111,191,147,0.1); border-color: rgba(111,191,147,0.25); }
  .secteur-fleche { color: #6FBF93; font-size: 11px; }
  .secteur-body { padding: 14px 2px 4px; }
  .cuisine-row {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between;
    padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.06);
  }
  .cuisine-taux { min-width: 260px; }
  .taux-paire { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .taux-champ { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .taux-champ input { max-width: 82px; }
  .taux-champ span { font-size: 11px; color: #8993A4; font-weight: 700; }
  .charges-form { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
  /* Ce lien porte des salaires : il ne se partage pas comme les autres, et ça doit se voir. */
  .lien-confidentiel { border-left: 2px solid #D4A857; padding-left: 12px; }
  .lien-avis { font-size: 10px; color: #D4A857; margin-top: 5px; display: flex; align-items: center; }
  /* Le verrou du lien gérant cuisine. Les deux boutons sont hauts de 36 px et bien séparés :
     « Nouveau lien » casse le lien de quelqu'un et ne doit pas se taper du pouce par erreur,
     c'est la même leçon que « Effacer la semaine ». */
  .mdp-bloc { margin-top: 10px; }
  .mdp-etat { font-size: 11px; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .mdp-etat.pose { color: #6FBF93; }
  .mdp-etat.absent { color: #8993A4; }
  .mdp-ligne { display: flex; gap: 8px; flex-wrap: wrap; }
  .mdp-ligne input {
    flex: 1 1 130px; min-width: 0; height: 36px; padding: 0 10px; font-size: 14px;
    background: #10151D; color: #F1EFEA; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
  }
  .mdp-ligne button {
    height: 36px; padding: 0 14px; font-size: 12px; font-weight: 700; border: 0; border-radius: 8px;
    background: #6FBF93; color: #10151D; cursor: pointer; flex: 0 0 auto;
  }
  .mdp-ligne button:disabled { opacity: 0.5; cursor: default; }
  .mdp-aide { font-size: 10px; color: #8993A4; margin-top: 5px; line-height: 1.4; }
  .lien-refaire {
    margin-top: 8px; height: 36px; padding: 0 12px; font-size: 12px; font-weight: 600;
    background: transparent; color: #E2685A; border: 1px solid rgba(226,104,90,0.45);
    border-radius: 8px; cursor: pointer;
  }
  /* En cuisine la pastille porte deux heures : le texte passe volontairement sur deux
     lignes plutôt que de déborder de la colonne. */
  .week-grid.grille-cuisine .shift-chip .st { font-size: 10.5px; line-height: 1.15; }
  .shift-chip.lecture { cursor: default; }
  .empty-cell.lecture { border-style: solid; border-color: rgba(255,255,255,0.05); color: rgba(255,255,255,0.14); cursor: default; }
  .week-grid { display: grid; gap: 4px; overflow-x: auto; font-size: 11px; }
  .day-head { text-align: center; padding: 6px 2px; }
  .day-head .dow { font-size: 8.5px; text-transform: uppercase; color: #8993A4; font-weight: 700; letter-spacing: 0.03em; }
  .day-head .dnum { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 600; margin-top: 2px; color: #F1EFEA; }
  .day-head.today .dnum { color: #D4A857; }
  /* Jours fériés et grosses journées : UNE seule couleur. Il y a eu une version à deux
     teintes, or et corail, et elle demandait de décoder une couleur avant de comprendre sa
     semaine. Le rouge dit « cette journée-là n'est pas ordinaire », le nom écrit en dessous
     dit laquelle, et l'infobulle porte le reste. La teinte descend sur toute la colonne
     parce qu'un en-tête coloré seul se perd au bas d'une grille de quatorze personnes. */
  .day-head.jour-marque { background: rgba(226,104,90,0.28); border-radius: 8px 8px 0 0; }
  .day-head .fete {
    font-size: 8px; font-weight: 700; line-height: 1.15; margin-top: 2px; color: #F0907F;
    /* Le nom peut passer sur deux lignes, mais jamais élargir la colonne : une grille qui
       s'étire pour un mot repousse le dimanche hors de l'écran. */
    overflow-wrap: anywhere;
  }
  .shift-cell.col-marque { background: rgba(226,104,90,0.14); }
  .emp-name-cell {
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start; color: #F1EFEA;
    padding: 4px 6px 4px 0; border-top: 1px solid rgba(255,255,255,0.06); overflow: hidden;
  }
  .emp-name-cell span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
  .emp-name-cell .emp-first { font-size: 11.5px; font-weight: 700; }
  /* Le nom de famille est le seul moyen de distinguer deux employées qui portent le même
     prénom : il doit rester lisible, juste un cran plus discret que le prénom. */
  .emp-name-cell .emp-last { font-size: 10px; font-weight: 600; color: #8993A4; }
  .shift-cell { border-top: 1px solid rgba(255,255,255,0.06); padding: 3px; min-height: 46px; display: flex; align-items: center; justify-content: center; }
  /* La couleur d'un quart dit son POSTE — une teinte par poste — et sa FAMILLE dit le bord :
     froid pour la salle, chaud pour la cuisine.

     Elle passe par une BARRE sur le côté, et surtout pas par le fond de la case. Le fond
     appartient aux alertes, qui sont toutes rouges : colonne d'un férié, rangée d'un
     dépassement d'heures, contour d'un quart posé pendant un congé. Mesuré en maquette :
     les quatre couleurs dans le fond noyaient complètement la colonne rouge d'un férié —
     on gagnait le poste et on perdait les alertes.

     Le vert et l'or servent aussi aux congés (Vacances en vert, Congé en or), mais jamais
     sous la même forme : une absence est une CASE entière teintée qui porte son mot écrit,
     un poste est un TRAIT sur une case qui porte une heure en gros. */
  .shift-chip {
    position: relative;
    width: 100%; height: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 3px 3px 3px 11px; text-align: center; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center;
  }
  .shift-chip::before {
    content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 4px; border-radius: 3px;
    background: #6FBF93;
  }
  .shift-chip .st { font-size: 13px; font-weight: 700; color: #6FBF93; line-height: 1.25; }
  .shift-chip.poste-hostess::before { background: #6F9FDE; }
  .shift-chip.poste-hostess .st { color: #8FB6E8; }
  .shift-chip.poste-cuisinier::before { background: #D4A857; }
  .shift-chip.poste-cuisinier .st { color: #D4A857; }
  .shift-chip.poste-plongeur::before { background: #CE6FA8; }
  .shift-chip.poste-plongeur .st { color: #DD8CBB; }
  /* Le poste et la tâche ont chacun leur ligne, mais AUCUNE des deux ne revient à la ligne :
     c'est ce qui garantit que la case ne s'allonge pas quand on écrit une tâche. Ce qui
     dépasse est coupé — le texte complet reste visible en ouvrant le quart. */
  /* ---- Congés et vacances ---- */
  .conges-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    color: #F1EFEA; font-size: 12px; font-weight: 700; padding: 9px 14px; border-radius: 12px;
  }
  .conges-toggle.ouvert { background: rgba(212,168,87,0.1); border-color: rgba(212,168,87,0.25); }
  .conges-fleche { color: #D4A857; font-size: 11px; }
  .conges-body { padding: 2px 2px 14px; }
  .conges-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
  .conges-form label { display: flex; flex-direction: column; gap: 3px; }
  .conges-form select, .conges-form input {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    padding: 8px 9px; font-size: 12px; color: #F1EFEA;
  }
  .conge-ajouter { background: #6FBF93; color: #10151D; font-size: 12px; font-weight: 700; padding: 9px 16px; border-radius: 8px; }
  .conges-vide { font-size: 12px; color: #8993A4; }
  .conges-liste { display: flex; flex-direction: column; gap: 6px; }
  .conge-ligne {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 10px; border-left: 3px solid #D4A857;
    background: rgba(255,255,255,0.03);
  }
  /* Chaque type a sa teinte : ce n'est pas la même chose à oublier. Un accident de travail
     prend le rouge, une maladie reste neutre — elle n'était pas prévue, mais elle n'engage
     personne. */
  .conge-ligne.conge-vacances { border-left-color: #6FBF93; }
  .conge-ligne.conge-maladie { border-left-color: #8993A4; }
  .conge-ligne.conge-cnesst { border-left-color: #E2685A; }
  .conge-nom { font-size: 12.5px; font-weight: 700; color: #F1EFEA; }
  .conge-dates { font-size: 11px; color: #8993A4; margin-top: 1px; }
  .conge-note { font-size: 11px; color: #D4A857; margin-top: 2px; }
  .conge-retirer { font-size: 10px; padding: 4px 9px; height: fit-content; }
  /* Une journée d'absence, dans la grille : on la voit sans avoir à ouvrir la liste. */
  .empty-cell.absent {
    border-style: solid; border-color: rgba(212,168,87,0.35); background: rgba(212,168,87,0.08);
    color: #D4A857; font-size: 8.5px; font-weight: 700;
  }
  .empty-cell.absent.absent-vacances {
    border-color: rgba(111,191,147,0.35); background: rgba(111,191,147,0.08); color: #6FBF93;
  }
  .empty-cell.absent.absent-maladie {
    border-color: rgba(137,147,164,0.35); background: rgba(137,147,164,0.08); color: #8993A4;
  }
  .empty-cell.absent.absent-cnesst {
    border-color: rgba(226,104,90,0.35); background: rgba(226,104,90,0.08); color: #E2685A;
  }
  /* Disponibilités dans la grille. La PÂLEUR plutôt qu'une couleur : la grille porte déjà
     les congés, les fériés, les rangées rouges du plafond d'heures et les conflits. Une
     cinquième couleur en ferait un arbre de Noël. La pâleur est un canal encore libre — ça
     se voit sans crier, et ça ne barre rien : le gérant peut toujours cliquer. */
  .empty-cell.pas-dispo {
    border-style: solid; border-color: rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.015); color: rgba(137,147,164,0.65);
    font-size: 8.5px; font-weight: 700;
  }
  .empty-cell.dispo-partielle { opacity: 0.55; }
  /* Un quart placé hors des disponibilités déclarées : un liseré, pas un contour plein —
     le contour plein rouge est réservé aux congés, qui sont plus forts. */
  .shift-chip.hors-dispo { border-style: dashed; border-color: rgba(137,147,164,0.7); }
  .dispo-manquantes {
    font-size: 11px; color: #D4A857; margin: 0 0 8px;
    background: rgba(212,168,87,0.08); border-radius: 8px; padding: 7px 10px;
  }
  /* Cédulé pendant une absence notée : c'est l'oubli qu'on cherche à empêcher. */
  .shift-chip.conflit { border-color: #E2685A; box-shadow: 0 0 0 1px #E2685A inset; }
  .shift-chip .rl, .shift-chip .tk {
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Les corps sont serrés exprès : les trois lignes doivent tenir dans la hauteur que la
     case avait déjà, sinon écrire une tâche allonge toute la grille. */
  .shift-chip .rl { font-size: 8px; line-height: 1.15; color: #8993A4; }
  .shift-chip .tk { font-size: 8.5px; line-height: 1.15; font-weight: 700; color: #D8DEE8; }
  /* Heures cédulées de la semaine, sous le nom. Affichées pour toute la grille de cuisine :
     n'en montrer que pour ceux qui ont un plafond rendrait les rangées inégales. */
  .emp-name-cell .emp-heures { font-size: 9px; font-weight: 700; color: #8993A4; }
  /* Plafond dépassé : toute la rangée rougit, pas seulement le nom — c'est en parcourant
     la semaine du regard qu'on doit le voir. */
  .emp-name-cell.depasse, .shift-cell.depasse { background: rgba(226,104,90,0.09); }
  .emp-name-cell.depasse .emp-first, .emp-name-cell.depasse .emp-heures { color: #E2685A; }
  .empty-cell {
    width: 100%; height: 100%; min-height: 40px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.12);
    background: none; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.2); font-size: 15px; cursor: pointer;
  }
  .empty-cell:hover { border-color: rgba(111,191,147,0.4); color: #6FBF93; }
  .shift-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .shift-form-grid label { display: flex; flex-direction: column; font-size: 11px; color: #8993A4; }
  .shift-form-grid input, .shift-form-grid select {
    margin-top: 5px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    padding: 9px 10px; font-size: 13px; color: #F1EFEA; font-family: inherit;
  }
  #shiftNoteInput { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 9px 10px; font-size: 13px; color: #F1EFEA; }
  /* Les tâches déjà utilisées se retapent d'un doigt : ce sont toujours les mêmes, et les
     retaper à la main finissait par donner trois orthographes pour la même affaire. */
  .taches-recentes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
  .taches-recentes button {
    background: rgba(111,191,147,0.12); border: 1px solid rgba(111,191,147,0.28); color: #6FBF93;
    font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
  }
  .tache-reste { font-size: 10px; color: #8993A4; margin-top: 5px; min-height: 13px; }
  .tache-reste.tache-plein { color: #D4A857; }
</style>
</head>

<script>
// ---------- Icônes (SVG en ligne, remplace les emojis pour un rendu pro cohérent) ----------
const ICON_PATHS = {
  dollar: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',
  chart: '<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/>',
  edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 8.97 6.28a2 2 0 0 0 2.06 0L22 7"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>',
  tag: '<path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.42 0l8.58-8.58a1 1 0 0 0 0-1.42Z"/><path d="M7 7h.01"/>',
  logo: '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash2: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/>',
  chef: '<path d="M6 20h12"/><path d="M7 16h10a4 4 0 0 0 .6-7.95 4.5 4.5 0 0 0-8.4-1.6A3.5 3.5 0 0 0 7 16Z"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
};
function icon(name, size, extraStyle) {
  return `<svg width="${size || 16}" height="${size || 16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;${extraStyle || ""}">${ICON_PATHS[name] || ""}</svg>`;
}

// Safari en navigation privée — et tout navigateur réglé pour bloquer les données de site —
// peut lever une exception sur le simple ACCÈS à localStorage, pas seulement sur l'écriture.
// Sans ces gardes, la ligne qui lit le jeton au chargement tuait le script en entier : écran
// blanc, rien ne répond. Ici, la préférence est simplement perdue le temps de la visite.
function lireStockage(zone, cle) {
  try {
    return window[zone].getItem(cle);
  } catch (e) {
    return null;
  }
}
function ecrireStockage(zone, cle, valeur) {
  try {
    window[zone].setItem(cle, valeur);
  } catch (e) {
    /* réglage de confidentialité ou stockage plein : la valeur ne survivra pas à la visite */
  }
}

// Quel onglet du tableau de bord est ouvert. Gardé dans localStorage parce qu'un gérant qui
// monte son horaire de cuisine rafraîchit la page vingt fois : le renvoyer aux déclarations
// à chaque fois lui coûterait le trajet à refaire.
// Quelles fiches sont ouvertes en modification. Vit au niveau du module et pas dans le HTML :
// render() reconstruit toute la page, un attribut posé sur un nœud ne survivrait pas au
// premier rafraîchissement — et on perdrait la saisie en cours.
const fichesEnEdition = new Set();

// Quelles fiches d'employé sont dépliées dans l'onglet Déclarations. Repliées par défaut :
// avec dix-huit personnes, l'onglet faisait 10,6 écrans de téléphone, et chaque fiche porte
// un code, un lien, trois chiffres, un plafond et un tableau. Ce qu'on cherche en l'ouvrant,
// c'est presque toujours UNE personne.
const fichesOuvertes = new Set();

// Modifier quelqu'un implique de le voir : une fiche en édition est forcément dépliée.
function ficheOuverte(id) {
  return fichesOuvertes.has(id) || fichesEnEdition.has(id);
}

const ONGLETS = ["declarations", "salle", "cuisine"];
let onglet = ONGLETS.includes(lireStockage("localStorage", "coco-onglet-admin"))
  ? lireStockage("localStorage", "coco-onglet-admin")
  : "declarations";

let TOKEN = lireStockage("sessionStorage", "adminToken") || "";
let overview = null;
let messages = [];
let absences = [];
// Les disponibilités déclarées par les employés. Lecture seule ici : c'est chacun qui
// remplit les siennes, par son lien personnel.
let disponibilites = [];
// Quelles sections « cuisine » sont déployées. Vit ici et pas dans le HTML : render()
// reconstruit toute la page, et une section refermée à chaque rafraîchissement serait
// insupportable.
const cuisinesOuvertes = new Set();
// Le secteur d'une personne : un seul choix à trois, et non deux boutons « → Cuisine » et
// « → Salle » qu'il aurait fallu multiplier pour ajouter « les deux ». Un menu dit d'un coup
// d'œil où la personne est ET ce qu'elle peut devenir.
// Corriger un nom ou un numéro d'employé. Il n'y avait aucun moyen de le faire : le numéro
// se saisissait à la création et plus jamais, et le nom pas du tout — une faute de frappe
// restait à l'écran pour toujours, ou obligeait à retirer la personne et à la recréer, ce
// qui lui aurait donné un nouveau code et cassé son lien.
function formEditionHTML(e) {
  if (!fichesEnEdition.has(e.id)) return "";
  return `
    <div class="edition-form" data-emp="${e.id}">
      <div class="edition-champs">
        <div>
          <label class="employee-stat-label" for="edit-nom-${e.id}">${t("nomEmploye")}</label>
          <input type="text" id="edit-nom-${e.id}" class="editNom" value="${(e.name || "").replace(/"/g, "&quot;")}" />
        </div>
        <div>
          <label class="employee-stat-label" for="edit-num-${e.id}">${t("numEmploye")}</label>
          <input type="text" id="edit-num-${e.id}" class="editNum" maxlength="20" value="${(e.employee_number || "").replace(/"/g, "&quot;")}" placeholder="—" />
        </div>
      </div>
      <div class="edition-actions">
        <button class="copy-btn" data-action="saveEdition" data-emp="${e.id}">${t("enregistrer")}</button>
        <button class="secondary-btn" data-action="annulerEdition" data-emp="${e.id}">${t("annuler")}</button>
      </div>
    </div>`;
}

function choixSecteurHTML(e) {
  const actuel = Secteurs.valide(e.secteur);
  return `
    <select class="secteur-select" data-action="changerSecteur" data-id="${e.id}" aria-label="${t("secteurDe", e.name)}">
      ${[
        ["salle", t("secteurSalle")],
        ["cuisine", t("secteurCuisine")],
        ["les_deux", t("secteurLesDeux")],
      ].map(([v, nom]) => `<option value="${v}" ${v === actuel ? "selected" : ""}>${nom}</option>`).join("")}
    </select>`;
}

function cuisineOuverte(rid) {
  return cuisinesOuvertes.has(rid);
}
let shifts = [];
const PERIOD_KEY = "coco-period-admin";
const PERIOD_DEFAUT = { mode: "2w", start: null, end: null }; // mode: '2w' | 'month' | 'all' | 'custom'

// La période choisie survit au rechargement de la page : sinon on retombe toujours sur
// « 2 dernières semaines », même quand on consulte le même mois plusieurs fois de suite.
function readPeriod() {
  try {
    const saved = JSON.parse(lireStockage("localStorage", PERIOD_KEY));
    if (!saved || !["2w", "month", "all", "custom"].includes(saved.mode)) return { ...PERIOD_DEFAUT };
    if (saved.mode === "custom" && !(saved.start && saved.end)) return { ...PERIOD_DEFAUT };
    return { mode: saved.mode, start: saved.start || null, end: saved.end || null };
  } catch (e) {
    return { ...PERIOD_DEFAUT };
  }
}
function setPeriod(next) {
  period = next;
  ecrireStockage("localStorage", PERIOD_KEY, JSON.stringify(period));
}

function localISO(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}
function todayISO() { return localISO(new Date()); }
function isoDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return localISO(d);
}

function resolvePeriod() {
  if (period.mode === "2w") return { start: isoDaysAgo(13), end: todayISO() };
  if (period.mode === "month") return { start: isoDaysAgo(29), end: todayISO() };
  if (period.mode === "all") return { start: null, end: null };
  return { start: period.start, end: period.end }; // custom
}

  if (!res.ok) throw new Error((await res.json()).error || "Erreur");
  return res.json();
}

// Un vrai petit graphique (pas juste des chiffres) : les pourboires nets des derniers jours,
// en ordre chronologique, pour repérer une tendance d'un coup d'œil.
function renderSparkline(entries) {
  if (!entries || entries.length < 2) return "";
  const recent = entries.slice(0, 8).slice().reverse(); // entries arrive déjà triées DESC -> on remet en ordre chronologique
  const values = recent.map((e) => e.net || 0);
  const max = Math.max(...values.map(Math.abs), 1);
  const barW = 10;
  const gap = 6;
  const chartH = 36;
  const width = recent.length * (barW + gap) - gap;
  const bars = values.map((v, i) => {
    const h = Math.max(2, (Math.abs(v) / max) * chartH);
    const x = i * (barW + gap);
    const y = v >= 0 ? chartH - h : chartH;
    return `<rect class="sparkline-bar${v < 0 ? " negative" : ""}" x="${x}" y="${y}" width="${barW}" height="${h}" rx="2"/>`;
  }).join("");
  return `
    <div class="sparkline-wrap">
      <div class="sparkline-label">${t("tendanceRecente")}</div>
      <svg width="${width}" height="${chartH}" viewBox="0 0 ${width} ${chartH}">${bars}</svg>
    </div>
  `;
}

function fmtDateLong(iso) {

// Convertit un timestamp SQLite (stocké en UTC, ex: '2026-08-04 23:42:00') en date locale
// 'YYYY-MM-DD' selon le fuseau horaire de l'appareil qui consulte — sinon toute déclaration
// faite en soirée au Québec (UTC-4/-5) semble "en retard" à tort, puisqu'on serait déjà
// rendu au lendemain en UTC.
function utcToLocalDateStr(sqliteDatetime) {
  const d = new Date(sqliteDatetime.replace(" ", "T") + "Z");
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

// Compare la date de création figée (jamais touchée par une modification) à la date déclarée,
// pour savoir combien de jours de retard il y a eu à la déclarer.
// Le rappel de sauvegarde.
//
// Ce qu'on répare : le bouton « Télécharger une sauvegarde complète » était à 4 409 px du
// haut — cinq écrans et demi de défilement — et RIEN ne disait jamais qu'il était temps.
// Il fallait y penser tout seul, dans un écran qu'on n'ouvre pas tous les jours.
//
// Sept jours, parce que c'est le cycle du restaurant : une semaine de déclarations, c'est ce
// qu'on accepte de refaire à la main si le pire arrive. Le rappel ne sort pas avant : un
// bandeau qui s'affiche tous les jours devient un meuble, et on ne le voit plus — c'est
// exactement ce qu'on reproche au bandeau des retards juste en dessous.
const JOURS_AVANT_RAPPEL = 7;

function joursDepuisSauvegarde() {
  if (!overview || !overview.derniereSauvegarde) return null; // jamais sauvegardé
  const quand = new Date(overview.derniereSauvegarde.replace(" ", "T") + "Z");
  if (isNaN(quand)) return null;
  return Math.floor((Date.now() - quand.getTime()) / 86400000);
}

function rappelSauvegardeHTML() {
  const jours = joursDepuisSauvegarde();
  if (jours !== null && jours < JOURS_AVANT_RAPPEL) return "";
  // Le bouton est DANS le bandeau : un rappel qui dit « va voir plus bas » fait défiler cinq
  // écrans, et on abandonne en chemin.
  return `
    <div class="rappel-sauvegarde">
      <div>${icon("shield", 15, "margin-right:6px;")}${jours === null ? t("jamaisSauvegarde") : t("sauvegardeAncienne", jours)}</div>
      <button class="backup-btn" id="backupBtnRappel">${t("sauvegarderMaintenant")}</button>
    </div>`;
}

// Combien de jours de retard avant qu'une journée mérite une pastille.
//
// C'était 1 — donc « déclaré le lendemain » comptait comme un retard. C'est ce que l'équipe
// fait NORMALEMENT : une serveuse ferme à 23 h et déclare le lendemain matin en prenant son
// café. Le bandeau se remplissait donc du comportement normal, et un bandeau qui crie tout
// le temps, on arrête de le lire — c'est là que la vraie journée oubliée passe.
//
// Trois jours : après trois jours, c'est un oubli, pas une habitude.
const JOURS_AVANT_RETARD = 3;

/**
 * Une pastille par PERSONNE plutôt qu'une par journée.
 *
 * Mesuré sur une équipe de douze : le bandeau faisait 3 486 px — quatre écrans de téléphone,
 * 57 % de l'onglet — avec 104 pastilles et 104 petites croix. Regroupé, il fait 325 px.
 *
 * Ce n'est pas une invention : le bandeau des VIREMENTS, juste en dessous, regroupe déjà par
 * personne depuis toujours (`pendingByEmployee`). Celui des retards était le seul à ne pas
 * le faire.
 *
 * Les deux sortes restent comptées à part — « en retard » et « modifiée après coup » sont
 * deux faits différents, et les additionner ne voudrait rien dire. Une personne qui a les
 * deux porte les deux chiffres sur sa pastille.
 */
function regrouperParPersonne(flags) {
  const par = new Map();
  for (const f of flags) {
    if (!par.has(f.empId)) {
      par.set(f.empId, { empId: f.empId, name: f.name, retards: 0, modifiees: 0, entryIds: [] });
    }
    const g = par.get(f.empId);
    if (f.type === "late") g.retards++;
    else g.modifiees++;
    g.entryIds.push({ id: f.entryId, type: f.type });
  }
  // Le plus gros en premier : c'est la personne à relancer d'abord.
  return [...par.values()].sort((a, b) => (b.retards + b.modifiees) - (a.retards + a.modifiees));
}

function computeDelayDays(entry) {
  if (!entry.created_at || !entry.date) return 0;
  const createdLocalDate = utcToLocalDateStr(entry.created_at);
  const d1 = new Date(createdLocalDate + "T00:00:00Z");
  const d2 = new Date(entry.date + "T00:00:00Z");
  const diffDays = Math.round((d1 - d2) / (1000 * 60 * 60 * 24));
  return diffDays > 0 ? diffDays : 0;
}

// "Modifiée après coup" = les DONNÉES DÉCLARÉES (pas une action admin comme confirmer un
// virement) ont été sauvegardées un AUTRE jour que la création — pas juste le fait de
// remplir les champs un par un à la création (plusieurs sauvegardes de suite le même jour).
function wasModified(entry) {
  if (!entry.created_at || !entry.data_updated_at) return false;
  return utcToLocalDateStr(entry.created_at) !== utcToLocalDateStr(entry.data_updated_at);
}

function fmtModifiedDate(iso) {
  if (!iso) return "";
  const d = new Date(iso.replace(" ", "T") + "Z");
  return d.toLocaleDateString(t("locale"), { day: "numeric", month: "short" });
}

  overview.restaurants.forEach((r) => {
    r.employees.forEach((e) => {
      let empPending = 0; // net signé : positif = on lui doit, négatif = il nous doit
      let empDirection = null;
      e.entries.forEach((d) => {
        if (d.remit_direction === "employer_owes" && !d.transferred) {
          owedByMeCount++; owedByMeAmount += d.remit_amount || 0;
          empPending += d.remit_amount || 0;
          empDirection = "employer_owes";
        }
        if (d.remit_direction === "employee_owes" && !d.transferred) {
          owedToMeCount++; owedToMeAmount += d.remit_amount || 0;
          empPending -= d.remit_amount || 0;
          if (!empDirection) empDirection = "employee_owes";
        }
      });
      if (empPending !== 0) {
        pendingByEmployee.push({
          empId: e.id,
          name: e.name,
          amount: Math.abs(empPending),
          direction: empPending > 0 ? "employer_owes" : "employee_owes",
        });
      }
    });
  });
  const pendingCount = owedByMeCount + owedToMeCount;

  let lateCount = 0;
  let modifiedCount = 0;
  const flaggedEntries = []; // { empId, name, entryId, date, type: 'late' | 'modified' }
  overview.restaurants.forEach((r) => {
    r.employees.forEach((e) => {
      e.entries.forEach((d) => {
        const delay = computeDelayDays(d);
        if (delay >= JOURS_AVANT_RETARD && !d.delay_dismissed) {
          lateCount++;
          flaggedEntries.push({ empId: e.id, name: e.name, entryId: d.id, date: d.date, type: "late", delay });
        }
        if (wasModified(d) && !d.modified_dismissed) {
          modifiedCount++;
          flaggedEntries.push({ empId: e.id, name: e.name, entryId: d.id, date: d.date, type: "modified" });
        }
      });
    });
  });
  const flaggedTotal = lateCount + modifiedCount;
  const flaggedByEmployee = regrouperParPersonne(flaggedEntries);

  let html = `

    </div>
    <div class="content">
      <nav class="onglets" role="tablist" aria-label="${t("sections")}">
        ${[
          ["declarations", "dollar", t("ongletDeclarations"), flaggedTotal + pendingCount],
          ["salle", "calendar", t("ongletHoraireSalle"), 0],
          ["cuisine", "chef", t("ongletHoraireCuisine"), 0],
        ].map(([cle, ic, nom, pastille]) => `
          <button class="onglet ${onglet === cle ? "actif" : ""}" role="tab"

          </button>`).join("")}
      </nav>

  // Les déclarations : bandeaux d'alerte, messagerie, période, et la fiche de chaque
  // restaurant avec son équipe. Les deux horaires ont leur propre onglet plus bas.
  if (onglet === "declarations") {
    html += `
      ${rappelSauvegardeHTML()}
      ${flaggedTotal > 0 ? `
      <div class="pending-banner banner-delay">
        <div>${icon("search", 15, "margin-right:6px;")}${t("journeesRetardModif", lateCount, modifiedCount)}</div>
        <div class="pending-chips">
          ${flaggedByEmployee.map(g => `
            <span class="pending-chip-wrap">
              <button class="pending-chip ${g.retards ? "chip-owed-employee" : "chip-owed-employer"}" data-action="jumpToEmployee" data-emp="${g.empId}">
                ${g.name} · ${[
                  g.retards ? `${g.retards} ${icon("clock", 11)}` : "",
                  g.modifiees ? `${g.modifiees} ${icon("edit", 11)}` : "",
                ].filter(Boolean).join(" · ")}
              </button>
              <button class="chip-dismiss-x" data-action="dismissPersonne" data-emp="${g.empId}" title="${t("mettreDeCote")}">✕</button>
            </span>
          `).join("")}
        </div>
        <button class="tout-de-cote" data-action="dismissTout">${t("toutMettreDeCote")}</button>
      </div>` : ""}
      ${pendingCount > 0 ? `
      <div class="pending-banner">
        <div>${icon("alert", 15, "margin-right:6px;")}${t("journeesEnAttente", owedByMeCount, owedToMeCount, owedByMeAmount, owedToMeAmount)}</div>
        <div class="pending-chips">
          ${pendingByEmployee.map(p => `
            <button class="pending-chip ${p.direction === "employer_owes" ? "chip-owed-employee" : "chip-owed-employer"}" data-action="jumpToEmployee" data-emp="${p.empId}">
              ${p.name} · ${fmtMoney(p.amount)}
            </button>
          `).join("")}
        </div>
      </div>` : ""}
      <div class="card" id="messagesInboxCard">
        <div id="messagesInbox"></div>
      </div>
      <div class="card">
        <div class="section-label" id="periodeAfficheeLabel">${t("periodeAffichee")}</div>
        <div class="period-bar" role="group" aria-labelledby="periodeAfficheeLabel">
          <button class="period-btn ${period.mode === "2w" ? "active" : ""}" data-period="2w" aria-pressed="${period.mode === "2w"}">${t("p2Semaines")}</button>
          <button class="period-btn ${period.mode === "month" ? "active" : ""}" data-period="month" aria-pressed="${period.mode === "month"}">${t("p30Jours")}</button>
          <button class="period-btn ${period.mode === "all" ? "active" : ""}" data-period="all" aria-pressed="${period.mode === "all"}">${t("pTout")}</button>
          <div class="period-dates ${isCustom ? "active" : ""}">
            <input type="date" id="customStart" aria-label="${t("dateDebut")}" title="${t("dateDebut")}" value="${isCustom ? period.start || "" : ""}" />
            <span aria-hidden="true">${t("a")}</span>
            <input type="date" id="customEnd" aria-label="${t("dateFin")}" title="${t("dateFin")}" value="${isCustom ? period.end || "" : ""}" />
            <button class="period-apply" id="customApply" ${isCustom && period.start && period.end ? "" : "disabled"}>${t("appliquer")}</button>
            ${isCustom ? `<button class="period-clear" id="customClear" title="${t("effacerPeriode")}" aria-label="${t("effacerPeriode")}">✕</button>` : ""}
          </div>
        </div>
        <div class="period-error" id="periodError" role="status" aria-live="polite" hidden></div>
        <div class="period-label" aria-live="polite">${periodLabel}</div>
        <div class="export-row">
          <button class="export-btn" id="exportBtn">${icon("download", 13)} ${t("exporter")}</button>
          <button class="export-detail-btn" id="exportDetailBtn">${icon("download", 13)} ${t("exporterDetail")}</button>
        </div>
        <p class="export-aide">${t("exportAide")}</p>
        <button class="backup-btn" id="backupBtn">${icon("shield", 14)} ${t("sauvegarder")}</button>
        <p class="backup-hint">${t("sauvegardeAide")}</p>
      </div>
  `;

  html += `
      <div class="card">
        <div class="section-label">${t("ajouterRestaurant")}</div>
        <div class="add-form">
          <input type="text" id="newRestaurantName" placeholder="${t("nomRestaurantPlaceholder")}" />
          <button id="addRestaurantBtn">${t("ajouter")}</button>
        </div>
      </div>
    `;
  }

  overview.restaurants.forEach((r) => {
    const totVentes = r.employees.reduce((s, e) => s + e.totals.ventes, 0);
    const totNet = r.employees.reduce((s, e) => s + e.totals.net, 0);
    // La salle déclare des pourboires, la cuisine non : les deux listes n'ont pas les mêmes
    // colonnes, et mélanger les deux remplirait la page de 0,00 $ sans signification.
    // Quelqu'un qui travaille des deux bords apparaît dans les DEUX listes et les DEUX
    // grilles — c'est ce que veut dire « les deux ». Sa fiche porte une marque, sinon le
    // voir deux fois dans la page se lirait comme un doublon.
    // « ou a déjà déclaré des journées » n'est pas une coquetterie : c'est de l'argent.
    //
    // Déplacer une serveuse vers la cuisine la sortait de cette liste, mais ses déclarations
    // restent — donc sa pastille aussi, dans le bandeau des virements dus. La pastille
    // pointait alors vers une fiche qui n'existait plus : le clic ne faisait rien, et le
    // montant dû ne pouvait PLUS JAMAIS être marqué comme viré. Tant qu'il reste une
    // journée déclarée, la personne garde sa fiche ici, quel que soit son secteur.
    const equipeSalle = r.employees.filter(
      (e) => Secteurs.travailleEn(e.secteur, "salle") || (e.entries && e.entries.length > 0)

    const equipeCuisine = r.employees.filter((e) => Secteurs.travailleEn(e.secteur, "cuisine"));

    // L'équipe de cuisine — ses liens, ses taux, ses plafonds, les charges — vit dans

    // découpage en onglets avait suivi la disposition de l'ancienne page au lieu du sens.

      <button class="secteur-toggle ${cuisineOuverte(r.id) ? "ouvert" : ""}" data-action="toggleCuisine" data-resto="${r.id}">
