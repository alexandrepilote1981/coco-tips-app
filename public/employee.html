async function api(path, opts) {

    headers: { "Content-Type": "application/json", ...(opts && opts.headers) },

// Retourne la date d'AUJOURD'HUI selon l'heure locale de l'appareil, pas UTC.
function todayLocalISO() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}
function isoDaysAgoLocal(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}
function addDaysLocal(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function dateToISO(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}
function fmtDateShort(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString(t("locale"), { weekday: "short", day: "numeric", month: "short" });
}

const ROLES_EMP = {

let period = { mode: "2w" }; // '2w' | 'month' | 'all'
function resolvePeriod() {
  if (period.mode === "2w") return { start: isoDaysAgoLocal(13), end: todayLocalISO() };
  if (period.mode === "month") return { start: isoDaysAgoLocal(29), end: todayLocalISO() };
  return { start: null, end: null }; // all
}

// Redimensionne et compresse la photo avant l'envoi.
function compressImage(file, maxDim = 1400, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else { width = Math.round(width * (maxDim / height)); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fmtMoney(n) {
  n = isFinite(n) ? n : 0;
  return n.toLocaleString(t("locale"), { style: "currency", currency: "CAD" });
}
function fmtPct(n) {
  n = isFinite(n) ? n : 0;
  return n.toFixed(1) + "%";
}

// Recalcule les champs dérivés d'une entrée LOCALEMENT, pour mettre à jour l'affichage
// instantanément sans attendre le serveur. Ce n'est plus un « miroir » du calcul serveur :
// c'est littéralement le même code, chargé depuis /shared/tip-math.js. Les deux ne peuvent
// donc plus diverger.
function recomputeEntry(entry) {
  TipMath.applyComputed(entry);
}

let conversation = [];
let myShifts = [];

async function load() {
  try {
    state = await api(`/api/employee/${CODE}`);
    try {
      const res = await api(`/api/employee/${CODE}/messages`);
      conversation = res.messages;
    } catch (e) {
      conversation = [];
    }
    try {
      const resShifts = await api(`/api/employee/${CODE}/shifts`);
      myShifts = resShifts.shifts;
    } catch (e) {
      myShifts = [];
    }
    render();
  } catch (e) {
    document.getElementById("app").innerHTML = `
      <div class="error-box">
        <h2>${t("codeInvalideTitle")}</h2>
        <p>${t("codeInvalideMsg")}</p>
      </div>`;
  }
}

async function saveEntry(entry) {
  return api(`/api/employee/${CODE}/entries`, { method: "POST", body: JSON.stringify(entry) });
}

async function deleteEntry(entryId) {
  await api(`/api/employee/${CODE}/entries/${entryId}`, { method: "DELETE" });
}

// ---------- Mises à jour ciblées (pas de reconstruction complète de l'écran) ----------

function refreshTotals() {
  const totVentes = currentEntries.reduce((s, e) => s + e.ventes, 0);
  const totClients = currentEntries.reduce((s, e) => s + e.clients, 0);
  const totBrut = currentEntries.reduce((s, e) => s + e.pourboireBrut, 0);
  const totNet = currentEntries.reduce((s, e) => s + e.net, 0);
  const pctMoyen = totVentes > 0 ? (totBrut / totVentes) * 100 : 0;
  const parClient = totClients > 0 ? totNet / totClients : 0;

  const kv = document.getElementById("kpi-ventes");
  const kn = document.getElementById("kpi-net");
  const kp = document.getElementById("kpi-pct");
  const kc = document.getElementById("kpi-client");
  if (kv) kv.textContent = fmtMoney(totVentes);
  if (kn) kn.textContent = fmtMoney(totNet);
  if (kp) kp.textContent = fmtPct(pctMoyen);
  if (kc) kc.textContent = fmtMoney(parClient);
  const dc = document.getElementById("days-count");
  if (dc) dc.textContent = t("journees", currentEntries.length);
}

function refreshCardSummary(entry) {
  if (entry.is_hotesse) {
    const el = document.getElementById(`sum-declare-${entry.id}`);
    if (el) el.textContent = fmtMoney(entry.net);
  } else {
    const moy = document.getElementById(`sum-moy-${entry.id}`);
    const pou = document.getElementById(`sum-pourb-${entry.id}`);
    const net = document.getElementById(`sum-net-${entry.id}`);
    if (moy) moy.textContent = fmtMoney(entry.moyenne);
    if (pou) pou.textContent = fmtMoney(entry.pourboireBrut);
    if (net) net.textContent = fmtMoney(entry.net);
  }
}

function flashSaved() {
  const note = document.querySelector(".saved-note");
  if (!note) return;
  note.textContent = "✓";
  setTimeout(() => { note.textContent = t("savedNote"); }, 900);
}

// Construit un item de type "carte" (jour) complet, avec tous ses écouteurs déjà attachés.
// Utilisé autant pour la construction initiale de la liste que pour remplacer UNE seule carte
// (ex: quand on bascule le mode hôtesse, qui change la mise en page du formulaire).
function buildCardElement(e) {
  const card = document.createElement("div");
  card.className = "card day-card";
  const dayIsHotesse = !!e.is_hotesse;
  const formHtml = dayIsHotesse ? `
    <div class="field-grid" style="grid-template-columns: 1fr;">
      <div class="field"><label>${t("montantRecuLabel")}</label>
        <input type="number" inputmode="decimal" placeholder="0.00" value="${e.ventes || ""}" data-id="${e.id}" data-field="ventes-hotesse" /></div>
    </div>
    <div class="day-summary">
      <span class="net">${t("montantDeclare")} <b id="sum-declare-${e.id}">${fmtMoney(e.net)}</b></span>
    </div>
  ` : `
    <div class="field-grid">
      <div class="field"><label>${t("ventesLabel")}</label>
        <input type="number" inputmode="decimal" placeholder="0.00" value="${e.ventes || ""}" data-id="${e.id}" data-field="ventes" /></div>
      <div class="field"><label>${t("clientsLabel")}</label>
        <input type="number" inputmode="numeric" placeholder="0" value="${e.clients || ""}" data-id="${e.id}" data-field="clients" /></div>
      <div class="field pct"><label>${t("pctLabel")}</label>
        <input type="number" inputmode="decimal" placeholder="10" value="${e.pct || ""}" data-id="${e.id}" data-field="pct" /></div>
      <div class="field"><label>${t("remisLabel")}</label>
        <input type="number" inputmode="decimal" placeholder="0.00" value="${e.remis || ""}" data-id="${e.id}" data-field="remis" /></div>
    </div>
    <div class="day-summary">
      <span>${t("moyClientShort")} <b id="sum-moy-${e.id}">${fmtMoney(e.moyenne)}</b></span>
      <span>${t("pourboires")} <b id="sum-pourb-${e.id}">${fmtMoney(e.pourboireBrut)}</b></span>
      <span class="net">${t("net")} <b id="sum-net-${e.id}">${fmtMoney(e.net)}</b></span>
    </div>
  `;
  card.innerHTML = `
    <div class="day-head">
      <input type="date" value="${e.date}" data-id="${e.id}" data-field="date" />
      <button class="del-btn" data-id="${e.id}" data-action="del">${icon("trash", 15)}</button>
    </div>
    <label class="hotesse-toggle ${dayIsHotesse ? "active" : ""}">
      <input type="checkbox" ${dayIsHotesse ? "checked" : ""} data-id="${e.id}" class="hotesse-checkbox" />
      ${icon("tag", 14)} ${t("hotesseTodayLabel")}
    </label>
    ${formHtml}
    <div class="photo-row">
      ${e.photo_filename
        ? `<a href="/api/photos/${e.photo_filename}" target="_blank"><img class="photo-thumb" src="/api/photos/${e.photo_filename}" alt="receipt" /></a>`
        : `<span class="photo-empty">${t("aucunePhoto")}</span>`}
      <label class="photo-btn">
        ${icon("camera", 14)} ${e.photo_filename ? t("remplacer") : t("ajouterMot")} ${t("releve")}
        <input type="file" accept="image/*" capture="environment" data-id="${e.id}" class="photo-input" hidden />
      </label>
    </div>
    <div class="remit-section">
      ${e.remit_direction && e.transferred ? `
      <div class="remit-confirmed">
        ${icon("check", 15)} ${e.remit_direction === "employer_owes" ? t("payeLe", e.transfer_date || "") : t("recuConfirmeLe", e.transfer_date || "")}
        <div class="remit-confirmed-amount">${fmtMoney(e.remit_amount)}</div>
      </div>
      ` : `
      <div class="remit-label">${t("remitLabel")}</div>
      <div class="remit-options">
        <button type="button" class="remit-btn ${!e.remit_direction ? "active" : ""}" data-id="${e.id}" data-remit="">${t("remitNone")}</button>
        <button type="button" class="remit-btn ${e.remit_direction === "employer_owes" ? "active-owed-employee" : ""}" data-id="${e.id}" data-remit="employer_owes">${icon("alert", 13)} ${t("remitEmployerOwes")}</button>
        <button type="button" class="remit-btn ${e.remit_direction === "employee_owes" ? "active-owed-employer" : ""}" data-id="${e.id}" data-remit="employee_owes">${icon("alert", 13)} ${t("remitEmployeeOwes")}</button>
      </div>
      ${e.remit_direction ? `
      <div class="field" style="margin-top:8px;">
        <label>${t("remitAmountLabel")}</label>
        <input type="number" inputmode="decimal" placeholder="0.00" value="${e.remit_amount || ""}" data-id="${e.id}" class="remit-amount-input" />
      </div>` : ""}
      `}
    </div>
  `;
  attachCardListeners(card, e);
  return card;
}

// Attache tous les écouteurs d'UNE carte. Les modifications de champs simples ne font QUE
// mettre à jour cette carte + les totaux, sans jamais reconstruire toute la liste — c'est ce
// qui évite les bogues d'interaction sur mobile (double-tap, date qui revient en arrière).
function attachCardListeners(card, e) {
  card.querySelectorAll('input[data-field]').forEach((inp) => {
    inp.addEventListener("change", async (ev) => {
      const field = ev.target.dataset.field;
      if (field === "ventes-hotesse") {
        e.ventes = parseFloat(ev.target.value) || 0;
        e.pct = 100; e.remis = 0; e.clients = 0;
      } else if (field === "date") {
        e.date = ev.target.value; // pas de recalcul de montants, juste la date
      } else {
        e[field] = parseFloat(ev.target.value) || 0;
      }
      recomputeEntry(e);
      refreshCardSummary(e);
      refreshTotals();
      try {
        await saveEntry(e);
        flashSaved();
      } catch (err) {
        alert(t("erreurSauvegarde"));
      }
    });
  });

  card.querySelector('.hotesse-checkbox').addEventListener("change", async (ev) => {
    e.is_hotesse = ev.target.checked;
    if (ev.target.checked) {
      // en entrant en mode hôtesse : ventes = montant reçu, le reste n'a pas de sens, on force à des valeurs neutres
      e.pct = 100; e.remis = 0; e.clients = 0;
    } else {
      // en sortant du mode hôtesse : on repart à zéro plutôt que de garder les valeurs forcées (ex: 100%) collées
      e.ventes = 0; e.pct = 0; e.remis = 0; e.clients = 0;
    }
    recomputeEntry(e);
    const newCard = buildCardElement(e); // la mise en page du formulaire change, donc on reconstruit CETTE carte seulement
    card.replaceWith(newCard);
    refreshTotals();
    await saveEntry(e);
    flashSaved();
  });

  card.querySelector('[data-action="del"]').addEventListener("click", async () => {
    if (!confirm(t("confirmDelete"))) return;
    card.remove();
    currentEntries = currentEntries.filter((x) => x.id !== e.id);
    state.entries = state.entries.filter((x) => x.id !== e.id);
    refreshTotals();
    await deleteEntry(e.id);
  });

  const photoInput = card.querySelector('.photo-input');
  if (photoInput) {
    photoInput.addEventListener("change", async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const label = ev.target.closest(".photo-btn");
      const originalHTML = label.innerHTML;
      label.textContent = t("envoiEnCours");
      try {
        const compressed = await compressImage(file);
        const res = await api(`/api/employee/${CODE}/entries/${e.id}/photo`, {
          method: "POST",
          body: JSON.stringify({ photoBase64: compressed }),
        });
        e.photo_filename = res.photo_filename;
        const newCard = buildCardElement(e); // la vignette photo change la mise en page, on reconstruit cette carte
        card.replaceWith(newCard);
      } catch (err) {
        alert(t("erreurPhoto"));
        label.innerHTML = originalHTML;
      }
    });
  }

  card.querySelectorAll('.remit-btn').forEach((btn) => {
    btn.addEventListener("click", async () => {
      e.remit_direction = btn.dataset.remit || null;
      const newCard = buildCardElement(e); // affiche/cache le champ montant selon la direction choisie
      card.replaceWith(newCard);
      await saveEntry(e);
      flashSaved();
    });
  });

  const remitAmountInput = card.querySelector('.remit-amount-input');
  if (remitAmountInput) {
    remitAmountInput.addEventListener("change", async (ev) => {
      e.remit_amount = parseFloat(ev.target.value) || 0;
      await saveEntry(e);
      flashSaved();
    });
  }
}

function render() {
  const { employee, restaurant, entries: allEntries } = state;
  const { start, end } = resolvePeriod();
  currentEntries = allEntries.filter((e) => (!start || e.date >= start) && (!end || e.date <= end));
  const entries = currentEntries;

  const totVentes = entries.reduce((s, e) => s + e.ventes, 0);
  const totClients = entries.reduce((s, e) => s + e.clients, 0);
  const totBrut = entries.reduce((s, e) => s + e.pourboireBrut, 0);
  const totNet = entries.reduce((s, e) => s + e.net, 0);
  const pctMoyen = totVentes > 0 ? (totBrut / totVentes) * 100 : 0;
  const parClient = totClients > 0 ? totNet / totClients : 0;

  const unreadReplies = conversation.filter((m) => m.sender === "admin" && !m.is_read).length;

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="header-top">
        <div>
          <p class="eyebrow">${restaurant.name}</p>
          <h1 class="title">${t("hello")} ${employee.name.split(" ")[0]}</h1>
        </div>
        <button class="lang-toggle" id="langToggle">${lang === "fr" ? "EN" : "FR"}</button>
      </div>
      <p class="saved-note">${t("savedNote")}</p>
    </div>
    <div class="content">
      ${unreadReplies > 0 ? `
      <div class="reply-banner" id="replyBanner">
        ${icon("bell", 15)} ${t("nouvelleReponse", unreadReplies)}
      </div>` : ""}
      <div class="card period-card">
        <div class="period-title-row">
          <div class="period-title">${t("periodeAffichee")}</div>
          <button class="message-tab-btn" id="openMessageModalBtn">${icon("mail", 14)} ${t("messageTab")} ${unreadReplies > 0 ? `<span class="msg-badge">${unreadReplies}</span>` : ""}</button>
        </div>
        <div class="period-bar">
          <button class="period-btn ${period.mode === "2w" ? "active" : ""}" data-period="2w">${t("p2Semaines")}</button>
          <button class="period-btn ${period.mode === "month" ? "active" : ""}" data-period="month">${t("p30Jours")}</button>
          <button class="period-btn ${period.mode === "all" ? "active" : ""}" data-period="all">${t("pTout")}</button>
        </div>
      </div>
      <div class="kpi-grid">
        <div class="card"><div class="kpi-label" style="color:#F1EFEA">${icon("dollar", 13)} ${t("ventesTotal")}</div><div class="kpi-value" id="kpi-ventes" style="color:#F1EFEA">${fmtMoney(totVentes)}</div></div>
        <div class="card"><div class="kpi-label" style="color:#6FBF93">${icon("trending", 13)} ${t("pourboiresNets")}</div><div class="kpi-value" id="kpi-net" style="color:#6FBF93">${fmtMoney(totNet)}</div></div>
        <div class="card"><div class="kpi-label" style="color:#D4A857">${t("pctMoyen")}</div><div class="kpi-value" id="kpi-pct" style="color:#D4A857">${fmtPct(pctMoyen)}</div></div>
        <div class="card"><div class="kpi-label" style="color:#E2685A">${icon("users", 13)} ${t("moyClient")}</div><div class="kpi-value" id="kpi-client" style="color:#E2685A">${fmtMoney(parClient)}</div></div>
      </div>

      ${myShifts.length > 0 ? `
      <div class="card schedule-card">
        <div class="section-label-sm">${icon("calendar", 14)} ${t("monHoraireAvenir")}</div>
        <div class="week-strip">
          ${(() => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = dateToISO(today);
            return Array.from({ length: 14 }, (_, i) => addDaysLocal(today, i)).map((d) => {
              const dStr = dateToISO(d);
              const shift = myShifts.find((s) => s.date === dStr);
              return `
                <div class="day-pill ${shift ? "worked" : ""} ${dStr === todayStr ? "is-today" : ""}">
                  <div class="dow">${d.toLocaleDateString(t("locale"), { weekday: "short" })}</div>
                  <div class="dnum">${d.getDate()}</div>
                  ${shift ? `
                    <div class="ptime">${shift.start_time}–${shift.end_time}</div>
                    <div class="prole">${ROLES_EMP[shift.role || "server"][lang]}</div>
                  ` : ""}
                </div>
              `;
            }).join("");
          })()}
        </div>
        <div class="swipe-hint">${t("glisseIndication")}</div>
      </div>` : ""}

      <div class="section-title">
        <span id="days-count">${t("journees", entries.length)}</span>
        <button class="add-btn" id="addBtn">${t("ajouter")}</button>
      </div>
      <p style="font-size:11px; color:#6B7280; margin:-4px 0 12px;">${t("multiEntryHint")}</p>
      <div id="daysList"></div>
    </div>

    <div id="messageModalOverlay" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <div class="modal-header-row">
          <h3>${icon("mail", 17)} ${t("messageTitle")}</h3>
          <button class="modal-close-x" id="closeMessageModalX">✕</button>
        </div>
        <div id="conversationHistory" class="conversation-history">
          ${conversation.length === 0 ? `<p class="conversation-empty">${t("aucunEchange")}</p>` : conversation.map((m) => `
            <div class="conv-bubble ${m.sender === "admin" ? "conv-admin" : "conv-employee"}">
              <div class="conv-sender">${m.sender === "admin" ? t("gerant") : t("moi")}</div>
              <div class="conv-body">${m.body.replace(/</g, "&lt;")}</div>
            </div>
          `).join("")}
        </div>
        <textarea id="messageBody" class="message-textarea" placeholder="${t("messagePlaceholder")}"></textarea>
        <p id="messageConfirm" class="message-confirm" style="display:none;">✓ ${t("messageSent")}</p>
        <div class="modal-actions">
          <button class="secondary danger-text" id="deleteConversationBtn">${t("supprimerConversation")}</button>
          <button id="sendMessageBtn">${t("messageSend")}</button>
        </div>
      </div>
    </div>
  `;

  const list = document.getElementById("daysList");
  list.innerHTML = "";
  entries.forEach((e) => list.appendChild(buildCardElement(e)));

  const messageOverlay = document.getElementById("messageModalOverlay");

  async function openMessageModal() {
    messageOverlay.style.display = "flex";
    document.getElementById("messageBody").focus();
    const history = document.getElementById("conversationHistory");
    if (history) history.scrollTop = history.scrollHeight;
    if (conversation.some((m) => m.sender === "admin" && !m.is_read)) {
      try {
        await api(`/api/employee/${CODE}/messages/mark-read`, { method: "POST", body: "{}" });
        conversation.forEach((m) => { if (m.sender === "admin") m.is_read = 1; });
        const banner = document.getElementById("replyBanner");
        if (banner) banner.remove();
      } catch (e) { /* pas grave si ça échoue, pas bloquant */ }
    }
  }

  document.getElementById("openMessageModalBtn").addEventListener("click", openMessageModal);
  const replyBanner = document.getElementById("replyBanner");
  if (replyBanner) replyBanner.addEventListener("click", openMessageModal);

  function closeMessageModal() {
    messageOverlay.style.display = "none";
  }

  document.getElementById("closeMessageModalX").addEventListener("click", closeMessageModal);
  messageOverlay.addEventListener("click", (ev) => {
    if (ev.target === messageOverlay) closeMessageModal(); // clic sur le fond sombre, pas sur la boîte elle-même
  });

  document.getElementById("deleteConversationBtn").addEventListener("click", async () => {
    if (conversation.length === 0) { closeMessageModal(); return; }
    if (!confirm(t("confirmSupprimerConversation"))) return;
    try {
      await api(`/api/employee/${CODE}/messages`, { method: "DELETE" });
      conversation = [];
      render(); // reconstruit l'écran pour que la conversation vide (et le badge) reflètent le vrai état tout de suite
    } catch (err) {
      alert(t("erreurSauvegarde"));
    }
  });

  document.getElementById("sendMessageBtn").addEventListener("click", async () => {
    const textarea = document.getElementById("messageBody");
    const body = textarea.value.trim();
    if (!body) return;
    const btn = document.getElementById("sendMessageBtn");
    const originalText = btn.textContent;
    btn.textContent = t("envoiEnCours");
    btn.disabled = true;
    try {
      await api(`/api/employee/${CODE}/messages`, { method: "POST", body: JSON.stringify({ body }) });
      conversation.push({ body, sender: "employee", is_read: 0, created_at: new Date().toISOString() });
      textarea.value = "";
      const history = document.getElementById("conversationHistory");
      if (history) {
        history.innerHTML = conversation.map((m) => `
          <div class="conv-bubble ${m.sender === "admin" ? "conv-admin" : "conv-employee"}">
            <div class="conv-sender">${m.sender === "admin" ? t("gerant") : t("moi")}</div>
            <div class="conv-body">${m.body.replace(/</g, "&lt;")}</div>
          </div>
        `).join("");
        history.scrollTop = history.scrollHeight;
      }
      const confirm = document.getElementById("messageConfirm");
      confirm.style.display = "block";
      setTimeout(() => { confirm.style.display = "none"; }, 1200);
    } catch (err) {
      alert(t("erreurSauvegarde"));
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });

  document.getElementById("langToggle").addEventListener("click", () => {
    setLang(lang === "fr" ? "en" : "fr");
  });

  document.querySelectorAll('[data-period]').forEach((btn) => {
    btn.addEventListener("click", () => {
      period = { mode: btn.dataset.period };
      render();
    });
  });

  document.getElementById("addBtn").addEventListener("click", async () => {
    const today = todayLocalISO();
    const payload = { date: today, ventes: 0, clients: 0, pct: 0, remis: 0, is_hotesse: false };
    const res = await saveEntry(payload);
    const newEntry = { ...payload, id: res.id, pourboireBrut: 0, net: 0, moyenne: 0, photo_filename: null, remit_direction: null, remit_amount: 0, transferred: 0, transfer_date: null };
    state.entries.push(newEntry);
    currentEntries.unshift(newEntry);
    document.getElementById("daysList").prepend(buildCardElement(newEntry));
    refreshTotals();
  });
}

load();
</script>
</body>
</html>
