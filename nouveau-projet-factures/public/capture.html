<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Déposer une facture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
    :root {
      --fond: #10151D; --carte: #161C26; --texte: #F1EFEA; --gris: #8993A4;
      --vert: #6FBF93; --or: #D4A857; --rouge: #E2685A; --bord: #232B38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--fond); color: var(--texte);
      font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 16px; line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0 0 .5rem; }
    a { color: var(--vert); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
    .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
    .gris { color: var(--gris); }
    .or { color: var(--or); }
    .rouge { color: var(--rouge); }
    .vert { color: var(--vert); }
    button, .bouton {
      font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: .7rem 1.1rem;
      background: var(--vert); color: #0B1016; cursor: pointer; text-decoration: none; display: inline-block;
    }
    button.secondaire { background: transparent; color: var(--texte); border: 1px solid var(--bord); }
    button.danger { background: transparent; color: var(--rouge); border: 1px solid var(--rouge); }
    button:disabled { opacity: .5; cursor: default; }
    input, select, textarea {
      font: inherit; width: 100%; padding: .6rem .7rem; border-radius: 10px;
      border: 1px solid var(--bord); background: #0E131B; color: var(--texte);
    }
    label { display: block; font-size: .8rem; color: var(--gris); margin: .6rem 0 .2rem; }
    .grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .alerte { border-left: 3px solid var(--or); padding: .5rem .75rem; background: #1C1B14; border-radius: 8px; margin: .5rem 0; font-size: .9rem; }
    .alerte.grave { border-color: var(--rouge); background: #1E1416; }
    .geant { width: 100%; padding: 1.6rem; font-size: 1.2rem; border-radius: 16px; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="/shared/capture-photo.js"></script>
<script>
// Page du lien privé. Elle ne peut QUE déposer : aucun montant du registre n'y transite,
// parce que ce lien vit dans les favoris d'un téléphone qui peut se perdre.
const code = location.pathname.split("/").filter(Boolean)[1] || "";
let etat = "verification";  // verification | pret | envoi | fait | invalide
let erreur = "";
let dernier = null;
let compte = 0;

const $ = (s) => document.querySelector(s);
const echappe = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  $("#app").innerHTML = vue();
  $("#photographier")?.addEventListener("click", () => $("#fichier").click());
  $("#fichier")?.addEventListener("change", envoyer);
  $("#encore")?.addEventListener("click", () => { etat = "pret"; erreur = ""; render(); });
}

function vue() {
  if (etat === "verification") return `<p class="gris">Vérification du lien…</p>`;
  if (etat === "invalide") return `<h1>Lien invalide</h1><p class="gris">Ce lien de dépôt n'est plus valide. Demandez-en un nouveau depuis le site.</p>`;

  if (etat === "envoi") return `
    <h1>Envoi…</h1>
    <div class="carte"><strong>Analyse de la facture</strong>
    <p class="gris" style="margin:.25rem 0 0">Quelques secondes. Ne fermez pas la page.</p></div>`;

  if (etat === "fait") return `
    <h1>C'est déposé</h1>
    <div class="carte">
      <p class="vert" style="margin:0 0 .5rem"><strong>${echappe(dernier)}</strong></p>
      <p class="gris" style="margin:0">La facture attend votre confirmation sur le site principal.
      Rien n'est ajouté aux dépenses avant que vous l'ayez vérifiée.</p>
    </div>
    <button id="encore" class="geant">📷 Déposer une autre facture</button>
    ${compte > 1 ? `<p class="gris" style="text-align:center">${compte} factures déposées depuis ce téléphone.</p>` : ""}`;

  return `
    <h1>Déposer une facture</h1>
    ${erreur ? `<div class="alerte grave">${echappe(erreur)}</div>` : ""}
    <button id="photographier" class="geant">📷 Photographier</button>
    <input id="fichier" type="file" accept="image/*" capture="environment" hidden />
    <p class="gris" style="margin-top:1rem;font-size:.9rem">
      Cadrez la facture entière, bien à plat. Les petits caractères en bas contiennent souvent
      les numéros de TPS et de TVQ du fournisseur — ils comptent pour vos crédits de taxe.
    </p>`;
}

async function verifier() {
  const r = await fetch("/api/capture/" + encodeURIComponent(code));
  etat = r.ok ? "pret" : "invalide";
  render();
}

async function envoyer(e) {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file) return;

  etat = "envoi"; erreur = ""; render();
  try {
    const dataUrl = await CapturePhoto.compresser(file);
    const entetes = { "X-Capture-Code": code };
    let data = await CapturePhoto.deposer(dataUrl, entetes);
    if (data.doublon) {
      // Le lien de capture ne montre jamais de montant : on dit qu'il y a doublon, sans dire
      // de quelle facture il s'agit.
      if (!confirm("Cette photo a déjà été déposée. L'envoyer quand même ?")) {
        etat = "pret"; return render();
      }
      data = await CapturePhoto.deposer(dataUrl, entetes, true);
    }
    compte += 1;
    dernier = data.extraite ? "Facture lue et enregistrée" : "Photo enregistrée — à compléter à la main";
    etat = "fait";
  } catch (err) {
    erreur = err.message || "Envoi impossible";
    etat = "pret";
  }
  render();
}

render();
verifier();
</script>
</body>
</html>
